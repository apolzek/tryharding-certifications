global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: orders
    static_configs:
      - targets: ['app:9182']

  # PR #5120: "monitorar o novo serviço inventory" (o /metrics dele é lento, então timeout maior)
  - job_name: inventory
    scrape_timeout: 10s
    static_configs:
      - targets: ['app:9184']
