global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # 3 réplicas do checkout
  - job_name: checkout
    static_configs:
      - targets: ['app:9182', 'app:9184', 'app:9185']
