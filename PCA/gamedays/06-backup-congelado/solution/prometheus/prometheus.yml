global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: pushgateway
    # mantém job/instance que o PRÓPRIO job de backup enviou
    # (sem isso viram exported_job/exported_instance)
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
