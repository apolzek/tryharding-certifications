groups:
  - name: backup
    rules:
      # SLA do gameday: "1 dia" = 30 segundos. O backup deve rodar a cada 30s.
      - alert: BackupNaoRodou
        expr: backup_last_status{job="backup"} == 0
        labels:
          severity: page
        annotations:
          summary: "o backup de {{ $labels.instance }} falhou"
