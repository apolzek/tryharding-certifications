id: "188"
title: "Probe com disponibilidade < 90%"
topic: alerting-expressions
level: basic
domain: PromQL
lesson: ../promql-functions-lab/functions/avg_over_time/
prompt: |
  Alerta: serviços cuja **disponibilidade nos últimos 5 minutos ficou abaixo de 90%**, usando
  `avg_over_time_probe_success{service}` (1 = ok, 0 = falhou). Valor = disponibilidade.
hints:
  - "Disponibilidade = média de uma série 0/1."
  - "avg_over_time(v[5m]) < 0.9"
  - "avg_over_time(avg_over_time_probe_success[5m]) < 0.9"
solution: 'avg_over_time(avg_over_time_probe_success[5m]) < 0.9'
accepted_answers:
  - '0.9 > avg_over_time(avg_over_time_probe_success[5m])'
wrong_answers:
  - 'avg_over_time_probe_success < 0.9'
  - 'avg_over_time(avg_over_time_probe_success[5m]) < 90'
  - 'min_over_time(avg_over_time_probe_success[5m]) < 0.9'
explanation: |
  search fica ~75% (30 s fora a cada 2 min). Olhar a janela evita o 'pisca-pisca' do valor instantâneo.

  Pegadinha: `< 90` compara uma fração com porcentagem e dispara para todos (1 < 90).
