id: "182"
title: "NodeFilesystemFillingUp"
topic: alerting-expressions
level: intermediate
domain: PromQL
lesson: ../promql-functions-lab/functions/predict_linear/
prompt: |
  Alerta clássico do node-mixin: **filesystems que vão encher nas próximas 4 horas**, com base na
  tendência dos últimos 10 min de `predict_linear_node_filesystem_avail_bytes{mountpoint}`.
hints:
  - "predict_linear(v[janela], segundos_no_futuro)"
  - "Vai encher = previsão abaixo de zero."
  - "predict_linear(x[10m], 4 * 3600) < 0"
solution: 'predict_linear(predict_linear_node_filesystem_avail_bytes[10m], 4 * 3600) < 0'
accepted_answers:
  - 'predict_linear(predict_linear_node_filesystem_avail_bytes[10m], 14400) < 0'
wrong_answers:
  - 'predict_linear(predict_linear_node_filesystem_avail_bytes[10m], 4 * 3600)'
  - 'predict_linear(predict_linear_node_filesystem_avail_bytes[10m], 4 * 3600) > 0'
expect_empty: true
explanation: |
  `/data` quase sempre aparece (enche em 0,4–3,4 h); `/scratch` às vezes (ciclo de 10 min). `/var/log` não
  (enche em 8–11 h). Logo depois do 'logrotate' simulado (a cada 3 h) nada dispara por alguns minutos —
  por isso o corretor aceita resultado vazio quando o gabarito também está vazio. Em produção: `predict_linear(node_filesystem_avail_bytes{fstype!=""}[6h], 4*3600) < 0`,
  geralmente com `and` "já está abaixo de 40% livre" para evitar falso positivo.

  Pegadinha: `deriv < 0` pega qualquer disco que está enchendo, mesmo que leve anos.
