id: '211'
title: 'Subquery: o pico da taxa nos últimos 10 min'
topic: operators
level: intermediate
domain: PromQL
lesson: ../labs/promql-operators/#5-subqueries
prompt: |
  A rota `/api/search` de `rate_http_requests_total{route}` tem ~5 req/s, com **picos de ~40 req/s**
  (60 s a cada 5 min).

  Qual foi o **maior valor** de `rate(...[1m])` dessa rota nos **últimos 10 minutos**,
  avaliando o rate a cada **30s**?
hints:
- max_over_time() precisa de um range vector, mas rate() devolve instant vector
- 'Subquery: <expressão>[10m:30s] vira range vector'
- max_over_time(rate(...[1m])[10m:30s])
solution: max_over_time(rate(rate_http_requests_total{route="/api/search"}[1m])[10m:30s])
accepted_answers:
- max_over_time(rate(rate_http_requests_total{route="/api/search"}[1m])[10m:])
- max_over_time(rate(rate_http_requests_total{route="/api/search"}[1m])[10m:15s])
wrong_answers:
- max_over_time(rate_http_requests_total{route="/api/search"}[10m])
- rate(rate_http_requests_total{route="/api/search"}[10m])
tolerance: 0.08
explanation: |
  Uma **subquery** `expr[range:resolução]` avalia `expr` várias vezes (aqui a cada 30 s nos últimos
  10 min) e devolve um **range vector** — que pode alimentar `max_over_time`. Resultado ≈ **40**.
  `max_over_time(counter[10m])` pegaria o maior valor **acumulado** do counter (inútil), e
  `rate(x[10m])` dilui o pico na média (~12).
