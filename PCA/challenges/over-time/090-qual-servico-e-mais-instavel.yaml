id: "090"
title: "Qual serviço é mais instável"
topic: over-time
level: intermediate
domain: PromQL
lesson: ../promql-functions-lab/functions/stddev_over_time/
prompt: |
  checkout e search têm a mesma média de tráfego (~100 req/s). Calcule o **desvio padrão de cada
  serviço nos últimos 10 minutos** em `stddev_over_time_http_requests_per_second` para ver qual oscila mais.
hints:
  - "Dispersão de cada série no tempo."
  - "stddev_over_time(v[10m])"
  - "stddev_over_time(stddev_over_time_http_requests_per_second[10m])"
solution: 'stddev_over_time(stddev_over_time_http_requests_per_second[10m])'
accepted_answers:
  - 'sqrt(stdvar_over_time(stddev_over_time_http_requests_per_second[10m]))'
wrong_answers:
  - 'stddev(stddev_over_time_http_requests_per_second)'
  - 'stdvar_over_time(stddev_over_time_http_requests_per_second[10m])'
  - 'avg_over_time(stddev_over_time_http_requests_per_second[10m])'
explanation: |
  search ≈ 23, checkout ≈ 3 (+ anomalias), legacy = 0. Mesma média, consistência bem diferente.

  Pegadinha: `stddev(...)` sem `_over_time` mede a diferença ENTRE serviços agora.
