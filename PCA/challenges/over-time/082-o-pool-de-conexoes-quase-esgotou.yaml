id: "082"
title: "O pool de conexões quase esgotou?"
topic: over-time
level: basic
domain: PromQL
lesson: ../promql-functions-lab/functions/min_over_time/
prompt: |
  Retorne o **menor número de conexões livres** que cada pool
  (`min_over_time_hikaricp_connections_idle{pool}`) teve **nos últimos 5 minutos**.
hints:
  - "O 'vale' de cada série na janela."
  - "min_over_time(v[5m])"
  - "min_over_time(min_over_time_hikaricp_connections_idle[5m])"
solution: 'min_over_time(min_over_time_hikaricp_connections_idle[5m])'
wrong_answers:
  - 'min(min_over_time_hikaricp_connections_idle)'
  - 'avg_over_time(min_over_time_hikaricp_connections_idle[5m])'
explanation: |
  main cai para 1–2 conexões livres por 15 s a cada 3 min; replica fica ~20.
  Alerta real: `min_over_time(hikaricp_connections_idle[5m]) < 3`.

  Pegadinha: o valor instantâneo quase sempre parece saudável (~40).
