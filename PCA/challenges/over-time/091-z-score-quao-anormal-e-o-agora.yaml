id: "091"
title: "z-score: quão anormal é o agora"
topic: over-time
level: advanced
domain: PromQL
lesson: ../promql-functions-lab/functions/stddev_over_time/
prompt: |
  Detecção de anomalia: calcule o **z-score** do tráfego atual de cada serviço
  (`stddev_over_time_http_requests_per_second`) em relação aos últimos 10 minutos:
  (valor atual − média de 10m) ÷ desvio padrão de 10m.
hints:
  - "Três pedaços: o valor atual, avg_over_time(...[10m]) e stddev_over_time(...[10m])."
  - "Cuidado com a precedência: a subtração precisa de parênteses."
  - "(x - avg_over_time(x[10m])) / stddev_over_time(x[10m])"
solution: |
  (stddev_over_time_http_requests_per_second - avg_over_time(stddev_over_time_http_requests_per_second[10m]))
    / stddev_over_time(stddev_over_time_http_requests_per_second[10m])
wrong_answers:
  - 'stddev_over_time_http_requests_per_second - avg_over_time(stddev_over_time_http_requests_per_second[10m]) / stddev_over_time(stddev_over_time_http_requests_per_second[10m])'
  - '(stddev_over_time_http_requests_per_second - avg_over_time(stddev_over_time_http_requests_per_second[10m])) / stdvar_over_time(stddev_over_time_http_requests_per_second[10m])'
  - 'stddev_over_time_http_requests_per_second / stddev_over_time(stddev_over_time_http_requests_per_second[10m])'
explanation: |
  |z| > 3 costuma indicar anomalia. O `legacy` é constante: σ = 0 → 0/0 = **NaN** (o corretor aceita NaN = NaN).
  Em alertas, proteja com `and stddev_over_time(...) > 0`.

  Pegadinha: sem parênteses, `/` tem precedência sobre `-` e a conta fica errada.
