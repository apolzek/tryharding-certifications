id: "084"
title: "Falhou pelo menos uma vez?"
topic: over-time
level: intermediate
domain: PromQL
lesson: ../promql-functions-lab/functions/min_over_time/
prompt: |
  Escreva a expressão de alerta: **serviços cujo probe (`min_over_time_probe_success`) falhou pelo
  menos uma vez nos últimos 5 minutos**, mesmo que agora esteja ok.
hints:
  - "Se o mínimo da janela é 0, houve pelo menos uma falha."
  - "min_over_time(...) == 0"
  - "min_over_time(min_over_time_probe_success[5m]) == 0"
solution: 'min_over_time(min_over_time_probe_success[5m]) == 0'
accepted_answers:
  - 'min_over_time(min_over_time_probe_success[5m]) < 1'
wrong_answers:
  - 'avg_over_time(min_over_time_probe_success[5m]) == 0'
  - 'min_over_time(min_over_time_probe_success[5m])'
  - 'max_over_time(min_over_time_probe_success[5m]) == 0'
explanation: |
  O flap de 10 s do `api` some no valor instantâneo, mas `min_over_time` lembra dele por 5 min.

  Pegadinha: `avg_over_time(...) == 0` só dispara se falhou o TEMPO TODO.
