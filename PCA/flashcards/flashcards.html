labs/service-discovery-relabeling/\">labs/service-discovery-relabeling<\/a>"},{"id":"lab:service-discovery-relabeling:pegadinha:9","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab service-discovery-relabeling: pegadinha «<code>sample_limit<\/code> estourado = scrape inteiro perdido». O que acontece / por quê?","b":"<b><code>sample_limit<\/code> estourado = scrape inteiro perdido<\/b> (<code>up=0<\/code>), não \"só o excesso\". O limite é conferido <b>depois<\/b> do <code>metric_relabel_configs<\/code>.","x":"","s":"<a href=\"../labs/service-discovery-relabeling/\">labs/service-discovery-relabeling<\/a>"},{"id":"lab:service-discovery-relabeling:pegadinha:10","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab service-discovery-relabeling: pegadinha «<code>scrape_timeout<\/code> &gt; <code>scrape_interval<\/code>». O que acontece / por quê?","b":"é erro de config.","x":"Cola completa: <b><code>scrape_timeout<\/code> &gt; <code>scrape_interval<\/code><\/b> é erro de config.","s":"<a href=\"../labs/service-discovery-relabeling/\">labs/service-discovery-relabeling<\/a>"},{"id":"lab:service-discovery-relabeling:pegadinha:11","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab service-discovery-relabeling: pegadinha «<code>up<\/code> e <code>scrape_*<\/code> sempre usam os labels do alvo». O que acontece / por quê?","b":"<b><code>up<\/code> e <code>scrape_*<\/code> sempre usam os labels do alvo<\/b>, nunca os expostos (mesmo com <code>honor_labels: true<\/code>).","x":"","s":"<a href=\"../labs/service-discovery-relabeling/\">labs/service-discovery-relabeling<\/a>"},{"id":"lab:service-discovery-relabeling:pegadinha:12","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab service-discovery-relabeling: pegadinha «Reload falho não derruba o Prometheus». O que acontece / por quê?","b":"ele segue com a config anterior; <code>prometheus_config_last_reload_successful<\/code> vira 0.","x":"Cola completa: <b>Reload falho não derruba o Prometheus:<\/b> ele segue com a config anterior; <code>prometheus_config_last_reload_successful<\/code> vira 0.","s":"<a href=\"../labs/service-discovery-relabeling/\">labs/service-discovery-relabeling<\/a>"},{"id":"lab:service-discovery-relabeling:pegadinha:13","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab service-discovery-relabeling: pegadinha «file_sd recarrega sozinho». O que acontece / por quê?","b":"<b>file_sd recarrega sozinho<\/b> (inotify + <code>refresh_interval<\/code>); <code>prometheus.yml<\/code> <b>não<\/b> (precisa de <code>SIGHUP<\/code> ou <code>POST /-/reload<\/code> com <code>--web.enable-lifecycle<\/code>).","x":"","s":"<a href=\"../labs/service-discovery-relabeling/\">labs/service-discovery-relabeling<\/a>"},{"id":"lab:tsdb-storage:cola:1","d":"fundamentals","o":"lab","k":"cola","f":"lab tsdb-storage · Head (RAM) + WAL (<code>wal/<\/code>, segmentos, checkpoint) → ?","b":"blocos de <b>2h<\/b> (<code>index<\/code>, <code>chunks/<\/code>, <code>meta.json<\/code>, <code>tombstones<\/code>) → compactação (2h→6h→18h...; máx 10% da retenção / 31d) → retenção apaga blocos.","x":"Cola completa: Head (RAM) + WAL (<code>wal/<\/code>, segmentos, checkpoint) → blocos de <b>2h<\/b> (<code>index<\/code>, <code>chunks/<\/code>, <code>meta.json<\/code>, <code>tombstones<\/code>) → compactação (2h→6h→18h...; máx 10% da retenção / 31d) → retenção apaga blocos.","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:cola:2","d":"fundamentals","o":"lab","k":"cola","f":"lab tsdb-storage · Retenção: <code>storage.tsdb.retention.{time,size}<\/code> no config (3.x, com reload) ou flags <code>--storage.tsdb.retention.*<\/code> (deprecated). Padrão <span class=\"cloze\">[…]<\/span>. Relativa ao bloco mais novo.","b":"lab tsdb-storage · Retenção: <code>storage.tsdb.retention.{time,size}<\/code> no config (3.x, com reload) ou flags <code>--storage.tsdb.retention.*<\/code> (deprecated). Padrão <span class=\"cloze-a\">15d<\/span>. Relativa ao bloco mais novo.","x":"","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:cola:3","d":"fundamentals","o":"lab","k":"cola","f":"lab tsdb-storage · Complete: Disco ≈ retenção(s) × amostras/s × 1-2 …","b":"Disco ≈ retenção(s) × amostras/s × 1-2 B. RAM ∝ séries ativas (+ churn).","x":"","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:cola:4","d":"fundamentals","o":"lab","k":"cola","f":"lab tsdb-storage · Complete: promtool tsdb list | analyze | …","b":"<code>promtool tsdb list | analyze | dump | dump-openmetrics | create-blocks-from openmetrics|rules<\/code>.","x":"","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:cola:5","d":"fundamentals","o":"lab","k":"cola","f":"lab tsdb-storage · Admin API (<code>--web.enable-admin-api<\/code>): ?","b":"<code>snapshot<\/code>, <code>delete_series<\/code>, <code>clean_tombstones<\/code>.","x":"Cola completa: Admin API (<code>--web.enable-admin-api<\/code>): <code>snapshot<\/code>, <code>delete_series<\/code>, <code>clean_tombstones<\/code>.","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:cola:6","d":"fundamentals","o":"lab","k":"cola","f":"lab tsdb-storage · Staleness: stale marker quando série/alvo some; senão lookback <span class=\"cloze\">[…]<\/span> (<code>--query.lookback-delta<\/code>, ou <code>lookback_delta=<\/code> na API).","b":"lab tsdb-storage · Staleness: stale marker quando série/alvo some; senão lookback <span class=\"cloze-a\">5m<\/span> (<code>--query.lookback-delta<\/code>, ou <code>lookback_delta=<\/code> na API).","x":"","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:cola:7","d":"fundamentals","o":"lab","k":"cola","f":"lab tsdb-storage · OOO: ?","b":"<code>storage.tsdb.out_of_order_time_window<\/code> (padrão 0 = rejeita).","x":"Cola completa: OOO: <code>storage.tsdb.out_of_order_time_window<\/code> (padrão 0 = rejeita).","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:cola:8","d":"fundamentals","o":"lab","k":"cola","f":"lab tsdb-storage · Self-metrics: ?","b":"<code>prometheus_tsdb_head_series<\/code>, <code>..._head_samples_appended_total<\/code>, <code>..._wal_storage_size_bytes<\/code>, <code>..._storage_blocks_bytes<\/code>, <code>..._compactions_failed_total<\/code>, <code>..._time_retentions_total<\/code>.","x":"Cola completa: Self-metrics: <code>prometheus_tsdb_head_series<\/code>, <code>..._head_samples_appended_total<\/code>, <code>..._wal_storage_size_bytes<\/code>, <code>..._storage_blocks_bytes<\/code>, <code>..._compactions_failed_total<\/code>, <code>..._time_retentions_total<\/code>.","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:cola:9","d":"fundamentals","o":"lab","k":"cola","f":"lab tsdb-storage · Local = ?","b":"1 nó, sem replicação. Longo prazo/HA global = remote write / Thanos / Mimir.","x":"Cola completa: Local = 1 nó, sem replicação. Longo prazo/HA global = remote write / Thanos / Mimir.","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:pegadinha:1","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab tsdb-storage: pegadinha «<code>promtool tsdb analyze<\/code> não vê a head». O que acontece / por quê?","b":"Ele lê blocos. Métrica nova de 10 minutos atrás? Tire um snapshot e analise o snapshot, ou use <code>/api/v1/status/tsdb<\/code>.","x":"Cola completa: <b><code>promtool tsdb analyze<\/code> não vê a head.<\/b> Ele lê blocos. Métrica nova de 10 minutos atrás? Tire um snapshot e analise o snapshot, ou use <code>/api/v1/status/tsdb<\/code>.","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:pegadinha:2","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab tsdb-storage: pegadinha «<code>delete_series<\/code> não libera disco». O que acontece / por quê?","b":"Só grava tombstones. Precisa de <code>clean_tombstones<\/code> (ou esperar a compactação).","x":"Cola completa: <b><code>delete_series<\/code> não libera disco.<\/b> Só grava tombstones. Precisa de <code>clean_tombstones<\/code> (ou esperar a compactação).","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:pegadinha:3","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab tsdb-storage: pegadinha «Apagar série ainda raspada é inútil». O que acontece / por quê?","b":"ela volta no próximo scrape. Corrija na origem ou com <code>metric_relabel_configs<\/code>.","x":"Cola completa: <b>Apagar série ainda raspada é inútil:<\/b> ela volta no próximo scrape. Corrija na origem ou com <code>metric_relabel_configs<\/code>.","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:pegadinha:4","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab tsdb-storage: pegadinha «Retenção é por bloco e relativa ao bloco mais novo». O que acontece / por quê?","b":"<b>Retenção é por bloco e relativa ao bloco mais novo<\/b>, não ao relógio. E blocos só são apagados inteiros.","x":"","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:pegadinha:5","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab tsdb-storage: pegadinha «Retenção não reduz RAM». O que acontece / por quê?","b":"Quem manda na memória são as séries ativas na head.","x":"Cola completa: <b>Retenção não reduz RAM.<\/b> Quem manda na memória são as séries ativas na head.","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:pegadinha:6","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab tsdb-storage: pegadinha «Admin API desligada por padrão». O que acontece / por quê?","b":"<b>Admin API desligada por padrão<\/b> (<code>--web.enable-admin-api<\/code>). E <code>/-/reload<\/code> só com <code>--web.enable-lifecycle<\/code> (ou mande <code>SIGHUP<\/code>).","x":"","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:pegadinha:7","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab tsdb-storage: pegadinha «Flags de retenção estão deprecated no 3.x». O que acontece / por quê?","b":"<b>Flags de retenção estão deprecated no 3.x<\/b> (ainda funcionam). O jeito novo é <code>storage.tsdb.retention<\/code> no <code>prometheus.yml<\/code>, que muda com reload.","x":"","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:pegadinha:8","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab tsdb-storage: pegadinha «Unidades de tempo diferentes». O que acontece / por quê?","b":"OpenMetrics usa <b>segundos<\/b> (com fração); o text format clássico do Prometheus usa <b>milissegundos<\/b>; <code>--min-time/--max-time<\/code> do <code>promtool tsdb dump<\/code> são em <b>ms<\/b>; a API HTTP (<code>time=<\/code>, <code>start=<\/code>, <code>end=<\/code>) aceita unix em <b>segundos<\/b> ou RFC3339.","x":"Cola completa: <b>Unidades de tempo diferentes:<\/b> OpenMetrics usa <b>segundos<\/b> (com fração); o text format clássico do Prometheus usa <b>milissegundos<\/b>; <code>--min-time/--max-time<\/code> do <code>promtool tsdb dump<\/code> são em <b>ms<\/b>; a API HTTP (<code>time=<\/code>, <code>start=<\/code>, <code>end=<\/code>) aceita unix em <b>segundos<\/b> ou RFC3339.","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:pegadinha:9","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab tsdb-storage: pegadinha «Lookback de 5m». O que acontece / por quê?","b":"explica \"a série continua no gráfico depois que o pod morreu\" (quando não há stale marker) e \"buracos\" com scrape/eval &gt; 5m.","x":"Cola completa: <b>Lookback de 5m<\/b> explica \"a série continua no gráfico depois que o pod morreu\" (quando não há stale marker) e \"buracos\" com scrape/eval &gt; 5m.","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"lab:tsdb-storage:pegadinha:10","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab tsdb-storage: pegadinha «Snapshots não se apagam sozinhos». O que acontece / por quê?","b":"e ficam dentro do data dir: limpe <code>snapshots/<\/code>.","x":"Cola completa: <b>Snapshots não se apagam sozinhos<\/b> e ficam dentro do data dir: limpe <code>snapshots/<\/code>.","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"curated:promql-001","d":"promql","o":"curated","k":"curated","f":"Quais são os 4 tipos de dado de uma expressão PromQL?","b":"<ul><li><b>instant vector<\/b>: 1 amostra por série num instante (<code>up<\/code>)<\/li><li><b>range vector<\/b>: várias amostras por série numa janela (<code>up[5m]<\/code>)<\/li><li><b>scalar<\/b>: um número (<code>42<\/code>, <code>scalar(...)<\/code>)<\/li><li><b>string<\/b>: só literal (quase não usado)<\/li><\/ul>","x":"","s":"<a href=\"../promql-functions-lab/PCA.md\">promql-functions-lab/PCA.md<\/a>"},{"id":"curated:promql-002","d":"promql","o":"curated","k":"curated","f":"<code>rate(http_requests_total)<\/code> (sem <code>[5m]<\/code>): o que acontece?","b":"<b>Erro de parse<\/b>: <code>rate()<\/code> exige um <b>range vector<\/b>. Correto: <code>rate(http_requests_total[5m])<\/code>.","x":"","s":"<a href=\"../promql-functions-lab/functions/rate/\">promql-functions-lab/functions/rate<\/a>"},{"id":"curated:promql-003","d":"promql","o":"curated","k":"curated","f":"Os matchers <code>=~<\/code> e <code>!~<\/code> usam regex RE2 <span class=\"cloze\">[…]<\/span>: <code>{env=~\"prod\"}<\/code> casa <code>prod<\/code>, mas <b>não<\/b> <code>production<\/code> (use <code>prod.*<\/code>).","b":"Os matchers <code>=~<\/code> e <code>!~<\/code> usam regex RE2 <span class=\"cloze-a\">totalmente ancorada<\/span>: <code>{env=~\"prod\"}<\/code> casa <code>prod<\/code>, mas <b>não<\/b> <code>production<\/code> (use <code>prod.*<\/code>).","x":"","s":"<a href=\"https://prometheus.io/docs/prometheus/latest/querying/basics/#instant-vector-selectors\">https://prometheus.io/docs/prometheus/latest/querying/basics/#instant-vector-selectors<\/a>"},{"id":"curated:promql-004","d":"promql","o":"curated","k":"curated","f":"<code>{job=~\".*\"}<\/code> é um seletor válido sozinho?","b":"<b>Não.<\/b> Todo seletor precisa de pelo menos um matcher que <b>não<\/b> case com string vazia (ou do nome da métrica). Válidos: <code>{job=~\".+\"}<\/code>, <code>{job=~\".*\", env=\"prod\"}<\/code>, <code>http_requests_total{job=~\".*\"}<\/code>.","x":"","s":"<a href=\"https://prometheus.io/docs/prometheus/latest/querying/basics/#instant-vector-selectors\">https://prometheus.io/docs/prometheus/latest/querying/basics/#instant-vector-selectors<\/a>"},{"id":"curated:promql-005","d":"promql","o":"curated","k":"curated","f":"Como selecionar séries que <b>não têm<\/b> o label <code>env<\/code>?","b":"<code>http_requests_total{env=\"\"}<\/code>: label ausente é tratado como valor vazio.","x":"","s":""},{"id":"curated:promql-006","d":"promql","o":"curated","k":"curated","f":"Como selecionar métricas por regex <b>no nome<\/b>?","b":"<code>{__name__=~\"http_.*_total\"}<\/code>: o nome da métrica é só o label <code>__name__<\/code>.","x":"","s":""},{"id":"curated:promql-007","d":"promql","o":"curated","k":"curated","f":"Diferença entre o modificador <code>offset<\/code> e o modificador <code>@<\/code>?","b":"<ul><li><code>x offset 1h<\/code>: <b>relativo<\/b> ao instante de avaliação (valor de 1 h atrás).<\/li><li><code>x @ 1700000000<\/code>: <b>absoluto<\/b> (timestamp Unix fixo); também <code>@ start()<\/code> / <code>@ end()<\/code>.<\/li><li>Podem ser combinados: <code>x @ 1700000000 offset 5m<\/code>. Ambos vêm logo depois do seletor.<\/li><\/ul>","x":"","s":"<a href=\"../promql-functions-lab/functions/start/\">promql-functions-lab/functions/start<\/a>"},{"id":"curated:promql-008","d":"promql","o":"curated","k":"curated","f":"Sintaxe de uma <b>subquery<\/b> e o que ela retorna?","b":"<code>&lt;expr instantânea&gt;[&lt;range&gt;:&lt;resolução&gt;]<\/code> → retorna <b>range vector<\/b>. Ex.: <code>max_over_time(rate(x[5m])[1h:1m])<\/code> = maior rate de 5m na última hora, avaliado a cada 1m. Sem resolução (<code>[1h:]<\/code>) usa o <code>evaluation_interval<\/code> global.","x":"","s":"<a href=\"../promql-functions-lab/functions/max_over_time/\">promql-functions-lab/functions/max_over_time<\/a>"},{"id":"curated:promql-009","d":"promql","o":"curated","k":"curated","f":"No Prometheus 3.x, range selectors são <span class=\"cloze\">[…]<\/span>: uma amostra exatamente no início da janela é <span class=\"cloze\">[…]<\/span>.","b":"No Prometheus 3.x, range selectors são <span class=\"cloze-a\">left-open<\/span>: uma amostra exatamente no início da janela é <span class=\"cloze-a\">excluída<\/span>.","x":"","s":"<a href=\"https://prometheus.io/docs/prometheus/latest/migration/\">https://prometheus.io/docs/prometheus/latest/migration<\/a>"},{"id":"curated:promql-010","d":"promql","o":"curated","k":"curated","f":"O que é o <b>lookback delta<\/b> e qual o padrão?","b":"<b>5m<\/b> (<code>--query.lookback-delta<\/code>). Um instant vector pega a amostra mais recente de cada série nos últimos 5 min; série sem amostra há mais de 5 min (ou com <b>staleness marker<\/b>) não aparece.","x":"","s":""},{"id":"curated:promql-011","d":"promql","o":"curated","k":"curated","f":"<code>x &gt; 100<\/code> vs <code>x &gt; bool 100<\/code>?","b":"<ul><li>Sem <code>bool<\/code>: <b>filtro<\/b>. Séries falsas somem; as verdadeiras mantêm o valor original.<\/li><li>Com <code>bool<\/code>: devolve <b>0 ou 1<\/b> para todas as séries (remove o nome).<\/li><li>Entre dois escalares, <code>bool<\/code> é obrigatório: <code>1 &gt; bool 0<\/code>.<\/li><\/ul>","x":"","s":"<a href=\"../promql-functions-lab/functions/day_of_week/\">promql-functions-lab/functions/day_of_week<\/a>"},{"id":"curated:promql-012","d":"promql","o":"curated","k":"curated","f":"Precedência dos operadores binários (maior → menor)?","b":"1. <code>^<\/code> (associativo à <b>direita<\/b>) 2. <code>*<\/code> <code>/<\/code> <code>%<\/code> <code>atan2<\/code> 3. <code>+<\/code> <code>-<\/code> 4. <code>==<\/code> <code>!=<\/code> <code>&lt;=<\/code> <code>&lt;<\/code> <code>&gt;=<\/code> <code>&gt;<\/code> 5. <code>and<\/code> <code>unless<\/code> 6. <code>or<\/code>","x":"","s":""},{"id":"curated:promql-013","d":"promql","o":"curated","k":"curated","f":"Qual é o vector matching padrão em <code>a / b<\/code> entre dois instant vectors?","b":"<b>One-to-one<\/b>: pareia séries com <b>exatamente o mesmo conjunto de labels<\/b> (ignorando <code>__name__<\/code>). Séries sem par somem. Ajuste com <code>on(labels)<\/code> ou <code>ignoring(labels)<\/code>.","x":"","s":""},{"id":"curated:promql-014","d":"promql","o":"curated","k":"curated","f":"Quando usar <code>group_left<\/code>? Dê um exemplo.","b":"<b>Many-to-one<\/b>: o lado <b>esquerdo<\/b> tem várias séries para cada série do direito. <code>group_left(labels)<\/code> copia labels do lado direito: <code>rate(node_network_receive_bytes_total[5m]) * on(instance) group_left(nodename) node_uname_info<\/code>","x":"","s":"<a href=\"../promql-functions-lab/functions/info/\">promql-functions-lab/functions/info<\/a>"},{"id":"curated:promql-015","d":"promql","o":"curated","k":"curated","f":"<code>and<\/code>, <code>or<\/code>, <code>unless<\/code>: que tipo de matching e o que cada um retorna?","b":"<p><b>Many-to-many<\/b> (set operators):<\/p><ul><li><code>a and b<\/code>: séries de <code>a<\/code> que têm par em <code>b<\/code> (valores de <code>a<\/code>)<\/li><li><code>a or b<\/code>: todas de <code>a<\/code> + as de <code>b<\/code> sem par em <code>a<\/code><\/li><li><code>a unless b<\/code>: séries de <code>a<\/code> <b>sem<\/b> par em <code>b<\/code><\/li><\/ul>","x":"","s":""},{"id":"curated:promql-016","d":"promql","o":"curated","k":"curated","f":"<code>sum by (job) (x)<\/code> vs <code>sum without (instance) (x)<\/code>?","b":"<ul><li><code>by (job)<\/code>: mantém <b>só<\/b> os labels listados.<\/li><li><code>without (instance)<\/code>: remove os listados e <b>mantém o resto<\/b>.<\/li><\/ul><p>Em recording rules, <code>without<\/code> é preferido: preserva labels como <code>job<\/code>, <code>cluster<\/code>.<\/p>","x":"","s":""},{"id":"curated:promql-017","d":"promql","o":"curated","k":"curated","f":"Qual operador de agregação devolve as <b>séries originais<\/b> (labels intactos) em vez de uma série agregada?","b":"<code>topk(k, v)<\/code> e <code>bottomk(k, v)<\/code>: devolvem os elementos de entrada inalterados (por grupo, se usar <code>by<\/code>). Em range queries, o conjunto pode mudar a cada step.","x":"","s":""},{"id":"curated:promql-018","d":"promql","o":"curated","k":"curated","f":"O que faz <code>count_values(\"version\", build_info)<\/code>?","b":"Conta quantas séries têm cada <b>valor<\/b>; o valor vira o label <code>version<\/code>. Ex.: <code>{version=\"1.2\"} 3<\/code>.","x":"","s":""},{"id":"curated:promql-019","d":"promql","o":"curated","k":"curated","f":"<code>quantile(0.9, x)<\/code> vs <code>quantile_over_time(0.9, x[5m])<\/code> vs <code>histogram_quantile(0.9, ...)<\/code>?","b":"<ul><li><code>quantile<\/code>: entre <b>séries<\/b>, no mesmo instante (agregação).<\/li><li><code>quantile_over_time<\/code>: ao longo do <b>tempo<\/b>, por série.<\/li><li><code>histogram_quantile<\/code>: estima a partir de <b>buckets<\/b> de histograma.<\/li><\/ul>","x":"","s":"<a href=\"../promql-functions-lab/functions/quantile_over_time/\">promql-functions-lab/functions/quantile_over_time<\/a>"},{"id":"curated:promql-020","d":"promql","o":"curated","k":"curated","f":"<code>rate<\/code> vs <code>irate<\/code> vs <code>increase<\/code>: quando usar cada um?","b":"<ul><li><code>rate<\/code>: média <b>por segundo<\/b> na janela: alertas e recording rules.<\/li><li><code>irate<\/code>: por segundo usando só as <b>2 últimas amostras<\/b>: gráficos de counters voláteis.<\/li><li><code>increase<\/code>: <b>total<\/b> na janela (= <code>rate × segundos<\/code>): leitura humana (\"quantos na última hora\").<\/li><\/ul>","x":"","s":"<a href=\"../promql-functions-lab/functions/rate/\">promql-functions-lab/functions/rate<\/a>"},{"id":"curated:promql-021","d":"promql","o":"curated","k":"curated","f":"Regra de ouro: primeiro <span class=\"cloze\">[…]<\/span>, depois <span class=\"cloze\">[…]<\/span>: <code>sum(rate(x[5m]))<\/code>. Nunca <code>rate(sum(x)[5m:])<\/code>, porque o restart de um pod vira um <span class=\"cloze\">[…]<\/span>.","b":"Regra de ouro: primeiro <span class=\"cloze-a\">rate<\/span>, depois <span class=\"cloze-a\">sum<\/span>: <code>sum(rate(x[5m]))<\/code>. Nunca <code>rate(sum(x)[5m:])<\/code>, porque o restart de um pod vira um <span class=\"cloze-a\">reset falso do total<\/span>.","x":"","s":"<a href=\"../promql-functions-lab/functions/rate/\">promql-functions-lab/functions/rate<\/a>"},{"id":"curated:promql-022","d":"promql","o":"curated","k":"curated","f":"Por que <code>increase(errors_total[1h])<\/code> pode dar <code>2.97<\/code> num counter que só soma inteiros?","b":"<b>Extrapolação<\/b>: <code>rate<\/code>/<code>increase<\/code> extrapolam até as bordas da janela. Não é bug.","x":"","s":"<a href=\"../promql-functions-lab/functions/increase/\">promql-functions-lab/functions/increase<\/a>"},{"id":"curated:promql-023","d":"promql","o":"curated","k":"curated","f":"Quais funções são para <b>gauges<\/b> (e não para counters)?","b":"<code>delta<\/code>, <code>idelta<\/code>, <code>deriv<\/code>, <code>predict_linear<\/code> (e os <code>*_over_time<\/code>). Counters: <code>rate<\/code>, <code>irate<\/code>, <code>increase<\/code>, <code>resets<\/code>.","x":"","s":"<a href=\"../promql-functions-lab/functions/deriv/\">promql-functions-lab/functions/deriv<\/a>"},{"id":"curated:promql-024","d":"promql","o":"curated","k":"curated","f":"O que significa <code>predict_linear(node_filesystem_avail_bytes[6h], 4*3600) &lt; 0<\/code>?","b":"Regressão linear sobre as últimas 6 h, <b>projetada 4 h (em segundos) à frente<\/b>. O alerta clássico: \"o disco enche em 4 h\".","x":"","s":"<a href=\"../promql-functions-lab/functions/predict_linear/\">promql-functions-lab/functions/predict_linear<\/a>"},{"id":"curated:promql-025","d":"promql","o":"curated","k":"curated","f":"Forma correta de <code>histogram_quantile<\/code> num histograma <b>clássico<\/b> agregado por serviço?","b":"<code>histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))<\/code>. Mantenha o <code>le<\/code> no <code>by<\/code> e use <code>rate<\/code>.","x":"","s":"<a href=\"../promql-functions-lab/functions/histogram_quantile/\">promql-functions-lab/functions/histogram_quantile<\/a>"},{"id":"curated:promql-026","d":"promql","o":"curated","k":"curated","f":"Como calcular a <b>latência média<\/b> a partir de um histogram ou summary?","b":"<code>rate(x_sum[5m]) / rate(x_count[5m])<\/code>: soma das durações ÷ quantidade de observações.","x":"","s":"<a href=\"../promql-functions-lab/functions/histogram_avg/\">promql-functions-lab/functions/histogram_avg<\/a>"},{"id":"curated:promql-027","d":"promql","o":"curated","k":"curated","f":"O que <code>absent(up{job=\"api\"})<\/code> retorna?","b":"Vazio se a série existe; <code>{job=\"api\"} 1<\/code> se <b>não existe nenhuma<\/b>. Serve para alertar que \"a métrica sumiu\".","x":"","s":"<a href=\"../promql-functions-lab/functions/absent/\">promql-functions-lab/functions/absent<\/a>"},{"id":"curated:promql-028","d":"promql","o":"curated","k":"curated","f":"Como evitar \"No data\" quando uma soma de erros fica vazia?","b":"<code>sum(rate(errors_total[5m])) or vector(0)<\/code>","x":"","s":"<a href=\"../promql-functions-lab/functions/vector/\">promql-functions-lab/functions/vector<\/a>"},{"id":"curated:promql-029","d":"promql","o":"curated","k":"curated","f":"<code>scalar(v)<\/code> retorna <span class=\"cloze\">[…]<\/span> se <code>v<\/code> não tiver <span class=\"cloze\">[…]<\/span> elemento.","b":"<code>scalar(v)<\/code> retorna <span class=\"cloze-a\">NaN<\/span> se <code>v<\/code> não tiver <span class=\"cloze-a\">exatamente 1<\/span> elemento.","x":"","s":"<a href=\"../promql-functions-lab/functions/scalar/\">promql-functions-lab/functions/scalar<\/a>"},{"id":"curated:promql-030","d":"promql","o":"curated","k":"curated","f":"Assinatura de <code>label_replace<\/code> e o que acontece se a regex não casar?","b":"<code>label_replace(v, \"dst\", \"replacement\", \"src\", \"regex\")<\/code>: <b>destino primeiro<\/b>. Regex ancorada; se não casar, a série volta <b>inalterada<\/b> (sem erro).","x":"","s":"<a href=\"../promql-functions-lab/functions/label_replace/\">promql-functions-lab/functions/label_replace<\/a>"},{"id":"curated:promql-031","d":"promql","o":"curated","k":"curated","f":"<code>sort()<\/code> / <code>sort_desc()<\/code> têm efeito em range queries (gráficos)?","b":"<b>Não.<\/b> Só afetam <b>instant queries<\/b> (tabela/console).","x":"","s":"<a href=\"../promql-functions-lab/functions/sort/\">promql-functions-lab/functions/sort<\/a>"},{"id":"curated:promql-032","d":"promql","o":"curated","k":"curated","f":"Endpoints HTTP da API para consultas?","b":"<ul><li><code>/api/v1/query<\/code>: instant (<code>query<\/code>, <code>time<\/code>)<\/li><li><code>/api/v1/query_range<\/code>: range (<code>query<\/code>, <code>start<\/code>, <code>end<\/code>, <code>step<\/code>)<\/li><li><code>/api/v1/series<\/code>, <code>/api/v1/labels<\/code>, <code>/api/v1/label/&lt;nome&gt;/values<\/code>: metadados<\/li><\/ul>","x":"","s":""},{"id":"curated:promql-033","d":"promql","o":"curated","k":"curated","f":"<code>count(x)<\/code> vs <code>count_over_time(x[5m])<\/code>?","b":"<code>count<\/code>: número de <b>séries<\/b> no instante. <code>count_over_time<\/code>: número de <b>amostras<\/b> de cada série na janela.","x":"","s":"<a href=\"../promql-functions-lab/functions/count_over_time/\">promql-functions-lab/functions/count_over_time<\/a>"},{"id":"curated:promql-034","d":"promql","o":"curated","k":"curated","f":"Operações aritméticas mantêm o nome da métrica?","b":"Não: aritmética (e <code>bool<\/code>) <b>removem<\/b> <code>__name__<\/code>. Comparação usada como <b>filtro<\/b> (sem <code>bool<\/code>) mantém a série original com o nome.","x":"","s":""},{"id":"curated:promql-035","d":"promql","o":"curated","k":"curated","f":"Query de <b>taxa de erro em %<\/b> de um serviço HTTP?","b":"<code>100 * sum(rate(http_requests_total{code=~\"5..\"}[5m])) / sum(rate(http_requests_total[5m]))<\/code>","x":"","s":"<a href=\"../promql-functions-lab/functions/rate/\">promql-functions-lab/functions/rate<\/a>"},{"id":"curated:promql-036","d":"promql","o":"curated","k":"curated","f":"Quais unidades de duração o PromQL aceita?","b":"<code>ms<\/code>, <code>s<\/code>, <code>m<\/code>, <code>h<\/code>, <code>d<\/code>, <code>w<\/code>, <code>y<\/code>, combináveis em ordem decrescente: <code>1h30m<\/code>. <code>1d<\/code> = 24 h, <code>1y<\/code> = 365 d.","x":"","s":""},{"id":"curated:promql-037","d":"promql","o":"curated","k":"curated","f":"Por que a janela do <code>rate<\/code> deve ser ≥ 4× o <code>scrape_interval<\/code>?","b":"<code>rate<\/code> precisa de <b>no mínimo 2 amostras<\/b> na janela; a folga tolera scrapes que falham. No Grafana, use <code>$__rate_interval<\/code>.","x":"","s":"<a href=\"../promql-functions-lab/functions/rate/\">promql-functions-lab/functions/rate<\/a>"},{"id":"curated:promql-038","d":"promql","o":"curated","k":"curated","f":"Query de <b>% de CPU ocupada<\/b> por instância (node_exporter)?","b":"<code>100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))<\/code>","x":"","s":"<a href=\"../promql-functions-lab/functions/rate/\">promql-functions-lab/functions/rate<\/a>"},{"id":"curated:promql-039","d":"promql","o":"curated","k":"curated","f":"Operação entre um vetor com labels e um vetor <b>sem<\/b> labels (ex.: <code>x / on() group_left vector(2)<\/code>): por que às vezes precisa de <code>on()<\/code>?","b":"Para casar séries com conjuntos de labels diferentes: <code>on()<\/code> (lista vazia) casa tudo com a série única do outro lado. Alternativa mais simples: <code>scalar(...)<\/code>.","x":"","s":"<a href=\"../promql-functions-lab/functions/scalar/\">promql-functions-lab/functions/scalar<\/a>"},{"id":"top15:1","d":"promql","o":"top15","k":"top15","f":"<code>rate<\/code>/<code>increase<\/code>/<code>irate<\/code>/<code>resets<\/code> → <span class=\"cloze\">[…]<\/span>. <code>delta<\/code>/<code>deriv<\/code>/<code>predict_linear<\/code>/<code>idelta<\/code> → <span class=\"cloze\">[…]<\/span>.","b":"<code>rate<\/code>/<code>increase<\/code>/<code>irate<\/code>/<code>resets<\/code> → <span class=\"cloze-a\">counters<\/span>. <code>delta<\/code>/<code>deriv<\/code>/<code>predict_linear<\/code>/<code>idelta<\/code> → <span class=\"cloze-a\">gauges<\/span>.","x":"","s":"<a href=\"../promql-functions-lab/PCA.md\">promql-functions-lab/PCA.md<\/a>"},{"id":"top15:2","d":"promql","o":"top15","k":"top15","f":"Funções <code>*_over_time<\/code>, <code>rate<\/code> etc. recebem <span class=\"cloze\">[…]<\/span> (<code>x[5m]<\/code>). Matemáticas (<code>abs<\/code>, <code>ceil<\/code>...) recebem <span class=\"cloze\">[…]<\/span>.","b":"Funções <code>*_over_time<\/code>, <code>rate<\/code> etc. recebem <span class=\"cloze-a\">range vector<\/span> (<code>x[5m]<\/code>). Matemáticas (<code>abs<\/code>, <code>ceil<\/code>...) recebem <span class=\"cloze-a\">instant vector<\/span>.","x":"","s":"<a href=\"../promql-functions-lab/PCA.md\">promql-functions-lab/PCA.md<\/a>"},{"id":"top15:3","d":"promql","o":"top15","k":"top15","f":"<span class=\"cloze\">[…]<\/span>, nunca o contrário.","b":"<span class=\"cloze-a\">Primeiro <code>rate<\/code>, depois <code>sum<\/code><\/span>, nunca o contrário.","x":"","s":"<a href=\"../promql-functions-lab/PCA.md\">promql-functions-lab/PCA.md<\/a>"},{"id":"top15:4","d":"promql","o":"top15","k":"top15","f":"<code>histogram_quantile<\/code> em histograma <span class=\"cloze\">[…]<  do resultado (não vira 0). Em SLI, um target que nunca respondeu não aparece com 0%.","x":"Cola completa: <b>Janela nunca é \"vazia = 0\".<\/b> Se não há amostra na janela, a série <b>some<\/b> do resultado (não vira 0). Em SLI, um target que nunca respondeu não aparece com 0%.","s":"<a href=\"../promql-functions-lab/functions/avg_over_time/\">promql-functions-lab/functions/avg_over_time<\/a>"},{"id":"lesson:avg_over_time:pegadinha:4","d":"promql","o":"lesson","k":"pegadinha","f":"⚠️ <code>avg_over_time()<\/code>: pegadinha «<code>avg_over_time(sum(x)[5m:])<\/code> ≠ <code>sum(avg_over_time(x[5m]))<\/code>». O que acontece / por quê?","b":"quando séries entram e saem no meio da janela. O primeiro exige subquery (<code>[5m:]<\/code>) e custa mais.","x":"Cola completa: <b><code>avg_over_time(sum(x)[5m:])<\/code> ≠ <code>sum(avg_over_time(x[5m]))<\/code><\/b> quando séries entram e saem no meio da janela. O primeiro exige subquery (<code>[5m:]<\/code>) e custa mais.","s":"<a href=\"../promql-functions-lab/functions/avg_over_time/\">promql-functions-lab/functions/avg_over_time<\/a>"},{"id":"lesson:avg_over_time:pegadinha:5","d":"promql","o":"lesson","k":"pegadinha","f":"⚠️ <code>avg_over_time()<\/code>: pegadinha «Histogramas». O que acontece / por quê?","b":"com native histograms, <code>avg_over_time<\/code> faz a \"média de histogramas\". Se a janela mistura amostras float e histogram, a série é <b>removida<\/b> do resultado (com aviso).","x":"Cola completa: <b>Histogramas:<\/b> com native histograms, <code>avg_over_time<\/code> faz a \"média de histogramas\". Se a janela mistura amostras float e histogram, a série é <b>removida<\/b> do resultado (com aviso).","s":"<a href=\"../promql-functions-lab/functions/avg_over_time/\">promql-functions-lab/functions/avg_over_time<\/a>"},{"id":"lesson:avg_over_time:pegadinha:6","d":"promql","o":"lesson","k":"pegadinha","f":"⚠️ <code>avg_over_time()<\/code>: pegadinha «Range selector é aberto à esquerda». O que acontece / por quê?","b":"no Prometheus 3: <code>[1m]<\/code> com scrape de 5s tem <b>12<\/b> amostras, não 13.","x":"Cola completa: <b>Range selector é aberto à esquerda<\/b> no Prometheus 3: <code>[1m]<\/code> com scrape de 5s tem <b>12<\/b> amostras, não 13.","s":"<a href=\"../promql-functions-lab/functions/avg_over_time/\">promql-functions-lab/functions/avg_over_time<\/a>"},{"id":"lesson:ceil:cola:1","d":"promql","o":"lesson","k":"cola","f":"<code>ceil()<\/code> · <code>ceil(v instant-vector)<\/code> → ?","b":"menor inteiro <b>≥<\/b> valor (direção +∞). <code>ceil(-1.5) = -1<\/code>, <code>ceil(+Inf) = +Inf<\/code>, <code>ceil(-0.5) = -0<\/code>.","x":"Cola completa: <code>ceil(v instant-vector)<\/code> → menor inteiro <b>≥<\/b> valor (direção +∞). <code>ceil(-1.5) = -1<\/code>, <code>ceil(+Inf) = +Inf<\/code>, <code>ceil(-0.5) = -0<\/code>.","s":"<a href=\"../promql-functions-lab/functions/ceil/\">promql-functions-lab/functions/ceil<\/a>"},{"id":"lesson:ceil:cola:2","d":"promql","o":"lesson","k":"cola","f":"<code>ceil()<\/code> · \"Quantos eu <span class=\"cloze\">[…]<\/span>?\" → <code>ceil<\/code>. \"Quantos <span class=\"cloze\">[…]<\/span>?\" → <code>floor<\/code>. \"Mais próximo?\" → <code>round<\/code>.","b":"<code>ceil()<\/code> · \"Quantos eu <span class=\"cloze-a\">preciso<\/span>?\" → <code>ceil<\/code>. \"Quantos <span class=\"cloze-a\">completos<\/span>?\" → <code>floor<\/code>. \"Mais próximo?\" → <code>round<\/code>.","x":"","s":"<a href=\"../promql-functions-lab/functions/ceil/\">promql-functions-lab/functions/ceil<\/a>"},{"id":"lesson:ceil:cola:3","d":"promql","o":"lesson","k":"cola","f":"<code>ceil()<\/code> · Capacity planning: ?","b":"<code>ceil(sum(rate(x[5m])) / capacidade_por_pod)<\/code>.","x":"Cola completa: Capacity planning: <code>ceil(sum(rate(x[5m])) / capacidade_por_pod)<\/code>.","s":"<a href=\"../promql-functions-lab/functions/ceil/\">promql-functions-lab/functions/ceil<\/a>"},{"id":"lesson:ceil:cola:4","d":"promql","o":"lesson","k":"cola","f":"<code>ceil()<\/code> · Escalar literal não vale: ?","b":"<code>ceil(1.2)<\/code> é erro; <code>ceil(vector(1.2))<\/code> = 2.","x":"Cola completa: Escalar literal não vale: <code>ceil(1.2)<\/code> é erro; <code>ceil(vector(1.2))<\/code> = 2.","s":"<a href=\"../promql-functions-lab/functions/ceil/\">promql-functions-lab/functions/ceil<\/a>"},{"id":"lesson:ceil:cola:5","d":"promql","o":"lesson","k":"cola","f":"<code>ceil()<\/code> · Complete: Cuidado com ponto flutuante …","b":"Cuidado com ponto flutuante logo acima de um inteiro.","x":"","s":"<a href=\"../promql-functions-lab/functions/ceil/\">promql-functions-lab/functions/ceil<\/a>"},{"id":"lesson:ceil:pegadinha:1","d":"promql","o":"lesson","k":"pegadinha","f":"⚠️ <code>ceil()<\/code>: pegadinha «Ponto flutuante». O que acontece / por quê?","b":"valores que \"deveriam\" ser inteiros podem ter lixo na 16ª casa (<code>3.0000000000000004<\/code>) e o <code>ceil<\/code> sobe um degrau inteiro. Se necessário, subtraia uma tolerância: <code>ceil(x - 1e-9)<\/code>.","x":"Cola completa: <b>Ponto flutuante:<\/b> valores que \"deveriam\" ser inteiros podem ter lixo na 16ª casa (<code>3.0000000000000004<\/code>) e o <code>ceil<\/code> sobe um degrau inteiro. Se necessário, subtraia uma tolerância: <code>ceil(x - 1e-9)<\/code>.","s":"<a href=\"../promql-functions-lab/functions/ceil/\">promql-functions-lab/functions/ceil<\/a>"},{"id":"lesson:ceil:pegadinha:2","d":"promql","o":"lesson","k":"pegadinha","f":"⚠️ <code>ceil()<\/code>: pegadinha «Negativos». O que acontece / por quê?","b":"<code>ceil(-1.5) = -1<\/code> (em direção ao +∞). Para \"arredondar pra longe do zero\", use <code>sgn(x) * ceil(abs(x))<\/code>.","x":"Cola completa: <b>Negativos:<\/b> <code>ceil(-1.5) = -1<\/code> (em direção ao +∞). Para \"arredondar pra longe do zero\", use <code>sgn(x) * ceil(abs(x))<\/code>.","s":"<a href=\"../promql-functions-lab/functions/ceil/\">promql-functions-lab/functions/ceil<\/a>"},{"id":"lesson:ceil:pegadinha:3","d":"promql","o":"lesson","k":"pegadinha","f":"⚠️ <code>ceil()<\/code>: pegadinha «Zero negativo». O que acontece / por quê?","b":"<code>ceil(-0.5)<\/code> devolve <code>-0<\/code>. Numericamente é igual a <code>0<\/code>, mas pode aparecer como <code>-0<\/code> em tabelas.","x":"Cola completa: <b>Zero negativo:<\/b> <code>ceil(-0.5)<\/code> devolve <code>-0<\/code>. Numericamente é igual a <code>0<\/code>, mas pode aparecer como <code>-0<\/code> em tabelas.","s":"<a href=\"../promql-functions-lab/functions/ceil/\">promql-functions-lab/functions/ceil<\/a>"},{"id":"lesson:ceil:pegadinha:4","d":"promql","o":"lesson","k":"pegadinha","f":"⚠️ <code>ceil()<\/code>: pegadinha «<code>ceil<\/code> antes ou depois de agregar». O que acontece / por quê?","b":"<code>sum(ceil(x))<\/code> (arredonda <b>cada<\/b> série, depois soma) ≥ <code>ceil(sum(x))<\/code>. Para capacity planning por serviço, arredonde por serviço (cada um tem seus pods).","x":"Cola completa: <b><code>ceil<\/code> antes ou depois de agregar:<\/b> <code>sum(ceil(x))<\/code> (arredonda <b>cada<\/b> série, depois soma) ≥ <code>ceil(sum(x))<\/code>. Para capacity planning por serviço, arredonde por serviço (cada um tem seus pods).","s":"<a href=\"../promql-functions-lab/functions/ceil/\">promql-functions-lab/functions/ceil<\/a>"},{"id":"lesson:ceil:pegadinha:5","d":"promql","o":"lesson","k":"pegadinha","f":"⚠️ <code>ceil()<\/code>: pegadinha «Não aplique em counter cru». O que acontece / por quê?","b":"<code>ceil(http_requests_total)<\/code> não tem sentido; primeiro <code>rate()<\/code>, depois divida, depois <code>ceil()<\/code>.","x":"Cola completa: <b>Não aplique em counter cru:<\/b> <code>ceil(http_requests_total)<\/code> não tem sentido; primeiro <code>rate()<\/code>, depois divida, depois <code>ceil()<\/code>.","s":"<a href=\"../promql-functions-lab/functions/ceil/\">promql-functions-lab/functions/ceil<\/a>"},{"id":"lesson:ceil:pegadinha:6","d":"promql","o":"lesson","k":"pegadinha","f":"⚠️ <code>ceil()<\/code>: pegadinha «Nome da métrica some». O que acontece / por quê?","b":"e <b>histogramas nativos são ignorados<\/b>, como em toda função matemática.","x":"Cola completa: <b>Nome da métrica some<\/b> e <b>histogramas nativos são ignorados<\/b>, como em toda função matemática.","s":"<a href=\"../promql-functions-lab/functions/ceil/\">promql-functions-lab/functions/ceil<\/a>"},{"id":"lesson:changes:cola:1","d":"promql","o":"lesson","k":"cola","f":"<code>changes()<\/code> · <code>changes(v[janela])<\/code> = quantas vezes o valor <span class=\"cloze\">[…]<\/span> (↑ ou ↓), inteiro.","b":"<code>changes()<\/code> · <code>changes(v[janela])<\/code> = quantas vezes o valor <span class=\"cloze-a\">mudou<\/span> (↑ ou ↓), inteiro.","x":"","s":"<a href=\"../promql-functions-lab/functions/changes/\">promql-functions-lab/functions/changes<\/a>"},{"id":"lesson:changes:cola:2","d":"promql","o":"lesson","k":"cola","f":"<code>changes()<\/code> · <code>resets<\/code> = só <span class=\"cloze\">[…]<\/span> (counters). <code>changes<\/code> = qualquer mudança (gauges de estado).","b":"<code>changes()<\/code> · <code>resets<\/code> = só <span class=\"cloze-a\">quedas<\/span> (counters). <code>changes<\/code> = qualquer mudança (gauges de estado).","x":"","s":"<a href=\"../promql-functions-lab/functions/changes/\">promql-functions-lab/functions/changes<\/a>"},{"id":"lesson:changes:cola:3","d":"promql","o":"lesson","k":"cola","f":"<code>changes()<\/code> · Flapping: ?","b":"<code>changes(up[10m]) &gt; 4<\/code> / <code>changes(probe_success[10m]) &gt; 4<\/code>.","x":"Cola completa: Flapping: <code>changes(up[10m]) &gt; 4<\/code> / <code>changes(probe_success[10m]) &gt; 4<\/code>.","s":"<a href=\"../promql-functions-lab/functions/changes/\">promql-functions-lab/functions/changes<\/a>"},{"id":"lesson:changes:cola:4","d":"promql","o":"lesson","k":"cola","f":"<code>changes()<\/code> · Restarts: ?","b":"<code>changes(process_start_time_seconds[1h])<\/code>.","x":"Cola completa: Restarts: <code>changes(process_start_time_seconds[1h])<\/code>.","s":"<a href=\"../promql-functions-lab/functions/changes/\">promql-functions-lab/functions/changes<\/a>"},{"id":"lesson:changes:cola:5","d":"promql","o":"lesson","k":"cola","f":"<code>changes()<\/code> · Complete: Em counter vivo ou gauge contínuo, <code>changes<\/code> …","b":"Em counter vivo ou gauge contínuo, <code>changes<\/code> ≈ nº de amostras − 1 (inútil).","x":"","s":"<a href=\"../promql-functions-lab/functions/changes/\">promql-functions-lab/functions/changes<\/a>"},{"id":"lesson:changes:pegadinha:1","d":"promql","o":"lesson","k":"pegadinha","f":"⚠️ <code>changes()<\/code>: pegadinha «Mudanças entre scrapes são invisíveis». O que acontece / por quê?","b":"se o backend cai e volta em 2s e o scrape é de 15s, o Prometheus pode nunca ver o <code>0<\/code>. <code>changes()<\/code> só conta o que foi <b>amostrado<\/b>.","x":"Cola completa: <b>Mudanças entre scrapes são invisíveis:<\/b> se o backend cai e volta em 2s e o scrape é de 15s, o Prometheus pode nunca ver o <code>0<\/code>. <code>changes()<\/code> só conta o que foi <b>amostrado<\/b>.","s":"<a href=\"../promql-functions-lab/functions/changes/\">promql-functions-lab/functions/changes<\/a>"},{"id":"lesson:changes:pegadinha:2","d":"promql","o":"lesson","k":"pegadinha","f":"⚠️ <code>changes()<\/code>: pegadinha «Ida e volta conta 2». O que acontece / por quê?","b":"<code>1 → 0 → 1<\/code> são <b>2<\/b> mudanças. Para \"quantas quedas\", use <code>resets()<\/code> (conta só descidas) num gauge 0/1 com cuidado, ou <code>count_over_time((x == 0)[10m:])<\/code>.","x":"Cola completa: <b>Ida e volta conta 2:<\/b> <code>1 → 0 → 1<\/code> são <b>2<\/b> mudanças. Para \"quantas quedas\", use <code>resets()<\/code> (conta só descidas) num gauge 0/1 com cuidado, ou <code>count_over_time((x == 0)[10m:])<\/code>.","s":"<a href=\"../promql-functions-lab/functions/changes/\">promql-functions-lab/functions/changes<\/a>"},{"id":"lesson:changes:pegadinha:3","d":"promql","o":"lesson","k":"pegadinha","f":"⚠️ <code>changes()<\/code>: pegadinha «Ruído de ponto flutuante». O que acontece / por quê?","b":"<code>0.1 + 0.2<\/code> vs <code>0.3<\/code> são valores diferentes. Gauges \"contínuos\" mudam em quase todo scrape.","x":"Cola completa: <b>Ruído de ponto flutuante:<\/b> <code>0.1 + 0.2<\/code> vs <code>0.3<\/code> são valores diferentes. Gauges \"contínuos\" mudam em quase todo scrape.","s":"<a href=\"../promql-functions-lab/functions/changes/\">promql-functions-lab/functions/changes<\/a>"},{"id":"lesson:changes:pegadinha:4","d":"promql","o":"lesson","k":"pegadinha","f":"⚠️ <code>changes()<\/code>: pegadinha «Série nova não é mudança». O que acontece / por quê?","b":"se a versão estiver num <b>label<\/b> (<code>build_info{version=\"1.2.3\"} 1<\/code>), cada versão é uma série nova com valor sempre 1, e <code>changes()<\/code> dá 0. Aí você conta séries: <code>count(count_over_time(build_info[1h]))<\/code>.","x":"Cola completa: <b>Série nova não é mudança:<\/b> se a versão estiver num <b>label<\/b> (<code>build_info{version=\"1.2.3\"} 1<\/code>), cada versão é uma série nova com valor sempre 1, e <code>changes()<\/code> dá 0. Aí você conta séries: <code>count(count_over_time(build_info[1h]))<\/code>.","s":"<a href=\"../promql-functions-lab/functions/changes/\">promql-functions-lab/functions/changes<\/a>"},{"id":"lesson:changes:pegadinha:5","d":"promql","o":"lesson","k":"pegadinha","f":"⚠️ <code>changes()<\/code>: pegadinha «Sem extrapolação». O que acontece / por quê?","b":"o resultado é inteiro e depende de quantas mudanças caíram dentro da janela.","x":"Cola completa: <b>Sem extrapolação:<\/b> o resultado é inteiro e depende de quantas mudanças caíram dentro da janela.","s":"<a href=\"../promql-functions-lab/functions/changes/\">promql-functions-lab/functions/changes<\/a>"},{"id":"lesson:clamp:cola:1","d":"promql","o":"lesson","k":"cola","f":"<code>clamp()<\/code> · <code>clamp(v, min, max)<\/code>: 3 argumentos; <code>min<\/code>/<code>max<\/code> são <sp de>sum<\/code>/<code>avg<\/code> viram NaN, <code>max<\/code>/<code>min<\/code>/<code>topk<\/code> ignoram, <code>quantile<\/code> trata como o menor valor.","s":"<a href=\"../labs/promql-operators/\">labs/promql-operators<\/a>"},{"id":"lab:promql-operators:pegadinha:7","d":"promql","o":"lab","k":"pegadinha","f":"⚠️ lab promql-operators: pegadinha «Vector matching é INNER JOIN». O que acontece / por quê?","b":"séries sem par somem <b>sem erro<\/b>. Resultado vazio? Compare os labels dos dois lados.","x":"Cola completa: <b>Vector matching é INNER JOIN:<\/b> séries sem par somem <b>sem erro<\/b>. Resultado vazio? Compare os labels dos dois lados.","s":"<a href=\"../labs/promql-operators/\">labs/promql-operators<\/a>"},{"id":"lab:promql-operators:pegadinha:8","d":"promql","o":"lab","k":"pegadinha","f":"⚠️ lab promql-operators: pegadinha «<code>on()<\/code> em one-to-one descarta os outros labels». O que acontece / por quê?","b":"<b><code>on()<\/code> em one-to-one descarta os outros labels<\/b>; <code>ignoring()<\/code> mantém.","x":"","s":"<a href=\"../labs/promql-operators/\">labs/promql-operators<\/a>"},{"id":"lab:promql-operators:pegadinha:9","d":"promql","o":"lab","k":"pegadinha","f":"⚠️ lab promql-operators: pegadinha «many-to-one sem <code>group_left<\/code> = erro». O que acontece / por quê?","b":"<b>many-to-one sem <code>group_left<\/code> = erro<\/b>; <b>many-to-many = sempre erro<\/b>.","x":"","s":"<a href=\"../labs/promql-operators/\">labs/promql-operators<\/a>"},{"id":"lab:promql-operators:pegadinha:10","d":"promql","o":"lab","k":"pegadinha","f":"lab promql-operators · <code>group_left<\/code>/<code>group_right<\/code> <span class=\"cloze\">[…]<\/span> valem para <code>and<\/code>/<code>or<\/code>/<code>unless<\/code>.","b":"lab promql-operators · <code>group_left<\/code>/<code>group_right<\/code> <span class=\"cloze-a\">não<\/span> valem para <code>and<\/code>/<code>or<\/code>/<code>unless<\/code>.","x":"","s":"<a href=\"../labs/promql-operators/\">labs/promql-operators<\/a>"},{"id":"lab:promql-operators:pegadinha:11","d":"promql","o":"lab","k":"pegadinha","f":"⚠️ lab promql-operators: pegadinha «<code>and<\/code>/<code>or<\/code>/<code>unless<\/code> olham só labels». O que acontece / por quê?","b":"<b><code>and<\/code>/<code>or<\/code>/<code>unless<\/code> olham só labels<\/b>, nunca valores. <code>a and b<\/code> devolve o valor de <b>a<\/b>.","x":"","s":"<a href=\"../labs/promql-operators/\">labs/promql-operators<\/a>"},{"id":"lab:promql-operators:pegadinha:12","d":"promql","o":"lab","k":"pegadinha","f":"⚠️ lab promql-operators: pegadinha «<code>^<\/code> é associativo à direita». O que acontece / por quê?","b":"e <code>and<\/code> tem precedência <b>maior<\/b> que <code>or<\/code>.","x":"Cola completa: <b><code>^<\/code> é associativo à direita<\/b> e <code>and<\/code> tem precedência <b>maior<\/b> que <code>or<\/code>.","s":"<a href=\"../labs/promql-operators/\">labs/promql-operators<\/a>"},{"id":"lab:promql-operators:pegadinha:13","d":"promql","o":"lab","k":"pegadinha","f":"⚠️ lab promql-operators: pegadinha «Média de médias». O que acontece / por quê?","b":"some numerador e denominador separadamente e só então divida.","x":"Cola completa: <b>Média de médias:<\/b> some numerador e denominador separadamente e só então divida.","s":"<a href=\"../labs/promql-operators/\">labs/promql-operators<\/a>"},{"id":"lab:promql-operators:pegadinha:14","d":"promql","o":"lab","k":"pegadinha","f":"lab promql-operators · <code>topk<\/code> numa <span class=\"cloze\">[…]<\/span> é recalculado a cada ponto (a legenda tem mais que k séries) — use <code>@ end()<\/code>.","b":"lab promql-operators · <code>topk<\/code> numa <span class=\"cloze-a\">range query<\/span> é recalculado a cada ponto (a legenda tem mais que k séries) — use <code>@ end()<\/code>.","x":"","s":"<a href=\"../labs/promql-operators/\">labs/promql-operators<\/a>"},{"id":"lab:promql-operators:pegadinha:15","d":"promql","o":"lab","k":"pegadinha","f":"lab promql-operators · <span class=\"cloze\">[…]<\/span> só funciona sem <code>by<\/code>; com <code>by(service)<\/code> o <code>vector(0)<\/code> (sem labels) vira uma série extra.","b":"lab promql-operators · <span class=\"cloze-a\"><code>sum(x) or vector(0)<\/code><\/span> só funciona sem <code>by<\/code>; com <code>by(service)<\/code> o <code>vector(0)<\/code> (sem labels) vira uma série extra.","x":"","s":"<a href=\"../labs/promql-operators/\">labs/promql-operators<\/a>"},{"id":"curated:instr-001","d":"instrumentation","o":"curated","k":"curated","f":"Quais são os 4 tipos de métrica e um exemplo de cada?","b":"<ul><li><b>Counter<\/b>: só sobe (<code>http_requests_total<\/code>)<\/li><li><b>Gauge<\/b>: sobe e desce (<code>memory_usage_bytes<\/code>, fila)<\/li><li><b>Histogram<\/b>: buckets + <code>_sum<\/code> + <code>_count<\/code> (<code>http_request_duration_seconds<\/code>)<\/li><li><b>Summary<\/b>: quantis calculados no cliente + <code>_sum<\/code> + <code>_count<\/code><\/li><\/ul>","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-002","d":"instrumentation","o":"curated","k":"curated","f":"Um counter pode diminuir?","b":"Não. Ele só volta a <b>0<\/b> quando o processo reinicia (reset). Em Go, <code>Add()<\/code> com valor negativo causa <b>panic<\/b>. Se o valor desce, é <b>gauge<\/b>.","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-003","d":"instrumentation","o":"curated","k":"curated","f":"Quais séries um histograma <b>clássico<\/b> <code>http_request_duration_seconds<\/code> expõe?","b":"<code>_bucket{le=\"...\"}<\/code> (<b>cumulativos<\/b>, incluindo <code>le=\"+Inf\"<\/code>), <code>_sum<\/code> e <code>_count<\/code>. O <code>_bucket{le=\"+Inf\"}<\/code> é igual ao <code>_count<\/code>.","x":"","s":"<a href=\"../promql-functions-lab/functions/histogram_quantile/\">promql-functions-lab/functions/histogram_quantile<\/a>"},{"id":"curated:instr-004","d":"instrumentation","o":"curated","k":"curated","f":"Histogram vs Summary: qual pode ser <b>agregado<\/b> entre instâncias?","b":"<b>Histogram<\/b> (somam-se os buckets e depois aplica-se <code>histogram_quantile<\/code>). Os quantis do <b>summary<\/b> não podem ser somados nem ter média calculada. O summary tem quantil exato por instância, mas é mais caro no cliente e os quantis são fixos.","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-005","d":"instrumentation","o":"curated","k":"curated","f":"Buckets padrão dos client libraries (segundos): <span class=\"cloze\">[…]<\/span>.","b":"Buckets padrão dos client libraries (segundos): <span class=\"cloze-a\">.005, .01, .025, .05, .1, .25, .5, 1, 2.5, 5, 10<\/span>.","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-006","d":"instrumentation","o":"curated","k":"curated","f":"Quais são as convenções de <b>nome<\/b> de métricas?","b":"<ul><li><code>snake_case<\/code>, prefixo do domínio/app (<code>myapp_<\/code>)<\/li><li>Counter termina em <code>_total<\/code><\/li><li>Unidade <b>base<\/b> no nome: <code>_seconds<\/code>, <code>_bytes<\/code>, <code>_meters<\/code><\/li><li><code>_ratio<\/code> para 0..1; <code>_info<\/code> para metadados<\/li><\/ul>","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-007","d":"instrumentation","o":"curated","k":"curated","f":"O que está errado em <code>http_request_duration_milliseconds<\/code>?","b":"Use <b>unidades base<\/b>: segundos (float). O certo é <code>http_request_duration_seconds<\/code>.","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-008","d":"instrumentation","o":"curated","k":"curated","f":"Quando <b>não<\/b> usar um label?","b":"Quando os valores não têm limite (<b>alta cardinalidade<\/b>): user ID, email, request ID, URL com IDs, timestamps. Cada combinação de valores é uma série nova.","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-009","d":"instrumentation","o":"curated","k":"curated","f":"Como criar e incrementar um counter com labels em Go (<code>client_golang<\/code>)?","b":"<pre><code>var reqs = promauto.NewCounterVec(\n  prometheus.CounterOpts{Name: \"myapp_requests_total\", Help: \"...\"},\n  []string{\"code\"})\nreqs.WithLabelValues(\"200\").Inc()\nhttp.Handle(\"/metrics\", promhttp.Handler())<\/code><\/pre>","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-010","d":"instrumentation","o":"curated","k":"curated","f":"Como instrumentar em Python (<code>prometheus_client<\/code>)?","b":"<pre><code>from prometheus_client import Counter, Histogram, start_http_server\nJOBS = Counter(\"jobs\", \"Jobs processados\", [\"queue\"])   # exposto como jobs_total\nLAT = Histogram(\"job_duration_seconds\", \"Duração\")\nstart_http_server(8000)\nJOBS.labels(\"emails\").inc()\nwith LAT.time(): work()<\/code><\/pre>","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-011","d":"instrumentation","o":"curated","k":"curated","f":"Como é o formato de exposição em texto?","b":"<pre><code># HELP http_requests_total Total de requisições.\n# TYPE http_requests_total counter\nhttp_requests_total{method=\"get\",code=\"200\"} 1027<\/code><\/pre><p>Timestamp (ms) opcional no fim da linha; quase nunca deve ser usado.<\/p>","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-012","d":"instrumentation","o":"curated","k":"curated","f":"O que o <b>OpenMetrics<\/b> acrescenta ao formato de texto clássico?","b":"Termina com <code># EOF<\/code>, <code># UNIT<\/code>, counters com sufixo <code>_total<\/code> obrigatório, séries <code>_created<\/code> e <b>exemplars<\/b>. Content-Type <code>application/openmetrics-text<\/code>.","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-013","d":"instrumentation","o":"curated","k":"curated","f":"O que é o padrão <b>info metric<\/b>?","b":"Um gauge com valor <b>1<\/b> e os metadados em labels: <code>myapp_build_info{version=\"1.2.3\",revision=\"abc\"} 1<\/code>. Faça join com <code>* on(instance) group_left(version) myapp_build_info<\/code>.","x":"","s":"<a href=\"../promql-functions-lab/functions/info/\">promql-functions-lab/functions/info<\/a>"},{"id":"curated:instr-014","d":"instrumentation","o":"curated","k":"curated","f":"node_exporter: porta, métricas típicas e textfile collector?","b":"Porta <b>9100<\/b>: <code>node_cpu_seconds_total<\/code>, <code>node_memory_MemAvailable_bytes<\/code>, <code>node_filesystem_avail_bytes<\/code>, <code>node_network_receive_bytes_total<\/code>. Textfile collector: <code>--collector.textfile.directory<\/code> com arquivos <code>*.prom<\/code> (métricas de cron/scripts).","x":"","s":"<a href=\"../labs/exporters-pushgateway/\">labs/exporters-pushgateway<\/a>"},{"id":"curated:instr-015","d":"instrumentation","o":"curated","k":"curated","f":"Como configurar o <b>blackbox_exporter<\/b> (padrão multi-target)?","b":"Raspe <code>/probe<\/code> com <code>params: {module: [http_2xx]}<\/code> e faça relabel: <code>__address__<\/code> → <code>__param_target<\/code>; <code>__param_target<\/code> → <code>instance<\/code>; <code>__address__<\/code> = <code>blackbox:9115<\/code>. Métrica-chave: <code>probe_success<\/code>.","x":"","s":"<a href=\"../labs/exporters-pushgateway/\">labs/exporters-pushgateway<\/a>"},{"id":"curated:instr-016","d":"instrumentation","o":"curated","k":"curated","f":"Quais são as pegadinhas do <b>Pushgateway<\/b>?","b":"<ul><li>As métricas <b>não expiram<\/b> (ficam até um DELETE)<\/li><li>O <code>up<\/code> reflete o Pushgateway, não o job<\/li><li>É um ponto único de falha<\/li><li>Exige <code>honor_labels: true<\/code> no scrape<\/li><li>Uso correto: jobs batch <b>service-level<\/b><\/li><\/ul>","x":"","s":"<a href=\"../labs/exporters-pushgateway/\">labs/exporters-pushgateway<\/a>"},{"id":"curated:instr-017","d":"instrumentation","o":"curated","k":"curated","f":"Como enviar uma métrica para o Pushgateway com curl?","b":"<code>echo \"backup_last_success_timestamp_seconds $(date +%s)\" | curl --data-binary @- http://pushgateway:9091/metrics/job/backup/instance/db1<\/code>. O <b>grouping key<\/b> é <code>job<\/code> + os labels do path.","x":"","s":"<a href=\"../labs/exporters-pushgateway/\">labs/exporters-pushgateway<\/a>"},{"id":"curated:instr-018","d":"instrumentation","o":"curated","k":"curated","f":"Pushgateway: PUT vs POST vs DELETE?","b":"<b>PUT<\/b> substitui <b>todas<\/b> as métricas do grupo; <b>POST<\/b> substitui só as métricas com o <b>mesmo nome<\/b>; <b>DELETE<\/b> apaga o grupo.","x":"","s":"<a href=\"../labs/exporters-pushgateway/\">labs/exporters-pushgateway<\/a>"},{"id":"curated:instr-019","d":"instrumentation","o":"curated","k":"curated","f":"Como alertar que um job batch <b>não roda há muito tempo<\/b>?","b":"O job expõe um gauge com timestamp: <code>backup_last_success_timestamp_seconds<\/code>. Alerta: <code>time() - backup_last_success_timestamp_seconds &gt; 26*3600<\/code>. O Pushgateway também expõe <code>push_time_seconds<\/code> por grupo.","x":"","s":"<a href=\"../labs/exporters-pushgateway/\">labs/exporters-pushgateway<\/a>"},{"id":"curated:instr-020","d":"instrumentation","o":"curated","k":"curated","f":"Exporter vs instrumentação direta?","b":"<b>Instrumentação direta<\/b>: seu código usa um client library. <b>Exporter<\/b>: traduz métricas de um sistema de terceiros que você não pode alterar (MySQL, HAProxy, hardware, SNMP) para o formato Prometheus.","x":"","s":"<a href=\"../labs/exporters-pushgateway/\">labs/exporters-pushgateway<\/a>"},{"id":"curated:instr-021","d":"instrumentation","o":"curated","k":"curated","f":"Cite exporters comuns e o que monitoram.","b":"node_exporter (hosts Linux), windows_exporter, blackbox (probes HTTP/TCP/ICMP/DNS), mysqld/postgres/redis exporters, snmp_exporter (rede), JMX exporter (JVM), cAdvisor (containers), kube-state-metrics (objetos do Kubernetes).","x":"","s":"<a href=\"../labs/exporters-pushgateway/\">labs/exporters-pushgateway<\/a>"},{"id":"curated:instr-022","d":"instrumentation","o":"curated","k":"curated","f":"kube-state-metrics vs cAdvisor?","b":"<b>kube-state-metrics<\/b>: <b>estado<\/b> dos objetos da API do k8s (<code>kube_pod_container_status_restarts_total<\/code>, <code>kube_deployment_status_replicas<\/code>). <b>cAdvisor<\/b> (no kubelet): <b>uso de recursos<\/b> dos containers (<code>container_cpu_usage_seconds_total<\/code>).","x":"","s":""},{"id":"curated:instr-023","d":"instrumentation","o":"curated","k":"curated","f":"Que métricas os client libraries expõem por padrão?","b":"Métricas do processo (<code>process_cpu_seconds_total<\/code>, <code>process_resident_memory_bytes<\/code>, <code>process_open_fds<\/code>) e do runtime (<code>go_goroutines<\/code>, <code>go_gc_*<\/code>, <code>python_gc_*<\/code>).","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-024","d":"instrumentation","o":"curated","k":"curated","f":"O que são <b>native histograms<\/b>?","b":"Histogramas com buckets <b>exponenciais esparsos<\/b> numa única série (o <code>schema<\/code> define a resolução). São mais precisos e baratos, e não têm <code>le<\/code>: <code>histogram_quantile(0.9, sum(rate(x[5m])))<\/code>.","x":"","s":"<a href=\"../promql-functions-lab/functions/histogram_quantile/\">promql-functions-lab/functions/histogram_quantile<\/a>"},{"id":"curated:instr-025","d":"instrumentation","o":"curated","k":"curated","f":"Métodos de um Gauge e exemplos de uso?","b":"<code>Set<\/code>, <code>Inc<\/code>, <code>Dec<\/code>, <code>Add<\/code>, <code>Sub<\/code>, <code>SetToCurrentTime<\/code>. Exemplos: requisições em andamento (in-flight), tamanho de fila, memória, temperatura, timestamp do último sucesso.","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-026","d":"instrumentation","o":"curated","k":"curated","f":"Qual tipo de métrica usar para contar <b>requisições em andamento<\/b> (in-flight)?","b":"<b>Gauge<\/b>: <code>Inc()<\/code> ao começar e <code>Dec()<\/code> ao terminar. Em Go: <code>promhttp.InstrumentHandlerInFlight<\/code>.","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-027","d":"instrumentation","o":"curated","k":"curated","f":"Onde deve ficar o <code>/metrics<\/code> de uma aplicação instrumentada e quem o chama?","b":"Num endpoint HTTP da própria app (ex.: <code>:8080/metrics<\/code>), servido pelo handler do client library. O <b>Prometheus<\/b> faz o GET a cada <code>scrape_interval<\/code>; a app não empurra nada.","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:instr-028","d":"instrumentation","o":"curated","k":"curated","f":"Por que inicializar as séries com labels conhecidos (ex.: <code>code=\"500\"<\/code>) com 0?","b":"Uma série que nunca foi incrementada <b>não existe<\/b>. Aí <code>rate<\/code> de erros some (em vez de dar 0) e queries/alertas com divisão quebram. Chame <code>WithLabelValues(\"500\")<\/code> no startup.","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"lab:exporters-pushgateway:cola:1","d":"instrumentation","o":"lab","k":"cola","f":"lab exporters-pushgateway · <b>Exporter<\/b> = tradutor para sistemas que você não controla. Código seu → ?","b":"instrumentação direta.","x":"Cola completa: <b>Exporter<\/b> = tradutor para sistemas que você não controla. Código seu → instrumentação direta.","s":"<a href=\"../labs/exporters-pushgateway/\">labs/exporters-pushgateway<\/a>"},{"id":"lab:exporters-pushgateway:cola:2","d":"instrumentation","o":"lab","k":"cola","f":"lab exporters-pushgateway · node_exporter :9100: ?","b":"<code>node_cpu_seconds_total<\/code> (counter, <code>rate<\/code>), <code>node_memory_MemAvailable_bytes<\/code>, <code>node_filesystem_avail_bytes<\/code>, <code>node_network_*_bytes_total<\/code>, <code>node_load1<\/code>. Textfile: <code>--collector.textfile.directory<\/code>, <code>*.prom<\/code>, escrita atômica, sem timestamp.","x":"Cola completa: <b>node_exporter :9100<\/b>: <code>node_cpu_seconds_total<\/code> (counter, <code>rate<\/code>), <code>node_memory_MemAvailable_bytes<\/code>, <code>node_filesystem_avail_bytes<\/code>, <code>node_network_*_bytes_total<\/code>, <code>node_load1<\/code>. Textfile: <code>--collector.textfile.directory<\/code>, <code>*.prom<\/code>, escrita atômica, sem timestamp.","s":"<a href=\"../labs/exporters-pushgateway/\">labs/exporters-pushgateway<\/a>"},{"id":"lab:exporters-pushgateway:cola:3","d":"instrumentation","o":"lab","k":"cola","f":"lab exporters-pushgateway · blackbox :9115: ?","b":"<code>/probe?module=X&amp;target=Y<\/code>; <code>probe_success<\/code>, <code>probe_duration_seconds<\/code>, <code>probe_http_status_code<\/code>, <code>probe_ssl_earliest_cert_expiry<\/code>. Relabel: <code>__address__→__param_target→instance<\/code>, <code>__address__=blackbox:9115<\/code>.","x":"Cola completa: <b>blackbox :9115<\/b>: <code>/probe?module=X&amp;target=Y<\/code>; <code>probe_success<\/code>, <code>probe_duration_seconds<\/code>, <code>probe_http_status_code<\/code>, <code>probe_ssl_earliest_cert_expiry<\/code>. Relabel: <code>__address__→__param_target→instance<\/code>, <code>__address__=blackbox:9115<\/code>.","s":"<a href=\"../labs/exporters-pushgateway/\">labs/exporters-pushgateway<\/a>"},{"id":"lab:exporters-pushgateway:cola:4","d":"instrumentation","o":"lab","k":"cola","f":"lab exporters-pushgateway · Pushgateway :9091: ?","b":"só batch de serviço de vida curta. <code>/metrics/job/&lt;j&gt;/&lt;label&gt;/&lt;valor&gt;<\/code>. POST (mesmo nome) · PUT (grupo todo) · DELETE. <code>push_time_seconds<\/code>. <b><code>honor_labels: true<\/code><\/b>. Nunca expira.","x":"Cola completa: <b>Pu
