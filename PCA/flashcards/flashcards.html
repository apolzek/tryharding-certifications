: <b>Série ausente ≠ zero<\/b>: counters com label só aparecem no primeiro <code>Inc()<\/code>. Inicialize com <code>WithLabelValues(...)<\/code>.","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"lab:instrumentation:pegadinha:6","d":"instrumentation","o":"lab","k":"pegadinha","f":"⚠️ lab instrumentation: pegadinha «<code>promtool check metrics<\/code> não vê cardinalidade». O que acontece / por quê?","b":"use <code>--extended<\/code>, o TSDB Status ou <code>count by (__name__)<\/code>.","x":"Cola completa: <b><code>promtool check metrics<\/code> não vê cardinalidade<\/b>: use <code>--extended<\/code>, o TSDB Status ou <code>count by (__name__)<\/code>.","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"lab:instrumentation:pegadinha:7","d":"instrumentation","o":"lab","k":"pegadinha","f":"⚠️ lab instrumentation: pegadinha «Python força <code>_total<\/code>». O que acontece / por quê?","b":"em counters (<code>Counter(\"requests\")<\/code> → <code>requests_total<\/code>) e expõe <code>_created<\/code>. No Go, o nome é exatamente o que você escreveu.","x":"Cola completa: <b>Python força <code>_total<\/code><\/b> em counters (<code>Counter(\"requests\")<\/code> → <code>requests_total<\/code>) e expõe <code>_created<\/code>. No Go, o nome é exatamente o que você escreveu.","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"lab:instrumentation:pegadinha:8","d":"instrumentation","o":"lab","k":"pegadinha","f":"lab instrumentation · Complete: Summary do Python …","b":"<b>Summary do Python não tem quantis.<\/b>","x":"","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"lab:instrumentation:pegadinha:9","d":"instrumentation","o":"lab","k":"pegadinha","f":"⚠️ lab instrumentation: pegadinha «Metadata no OpenMetrics». O que acontece / por quê?","b":"a família do counter não tem <code>_total<\/code> (<code># TYPE http_requests counter<\/code>), então <code>/api/v1/metadata?metric=http_requests_total<\/code> pode vir vazio para alvos raspados via OpenMetrics.","x":"Cola completa: <b>Metadata no OpenMetrics<\/b>: a família do counter não tem <code>_total<\/code> (<code># TYPE http_requests counter<\/code>), então <code>/api/v1/metadata?metric=http_requests_total<\/code> pode vir vazio para alvos raspados via OpenMetrics.","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"lab:instrumentation:pegadinha:10","d":"instrumentation","o":"lab","k":"pegadinha","f":"⚠️ lab instrumentation: pegadinha «Mudar buckets». O que acontece / por quê?","b":"muda as séries <code>_bucket<\/code>: comparar antes/depois no mesmo gráfico dá degraus estranhos.","x":"Cola completa: <b>Mudar buckets<\/b> muda as séries <code>_bucket<\/code>: comparar antes/depois no mesmo gráfico dá degraus estranhos.","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"lab:instrumentation:pegadinha:11","d":"instrumentation","o":"lab","k":"pegadinha","f":"⚠️ lab instrumentation: pegadinha «Timestamps nas métricas». O que acontece / por quê?","b":"não exponha timestamp nas amostras; o Prometheus põe o do scrape. Timestamp como <b>valor<\/b> (<code>*_timestamp_seconds<\/code>) é ok.","x":"Cola completa: <b>Timestamps nas métricas<\/b>: não exponha timestamp nas amostras; o Prometheus põe o do scrape. Timestamp como <b>valor<\/b> (<code>*_timestamp_seconds<\/code>) é ok.","s":"<a href=\"../labs/instrumentation/\">labs/instrumentation<\/a>"},{"id":"curated:alert-001","d":"alerting","o":"curated","k":"curated","f":"Quais são os campos de uma <b>alerting rule<\/b>?","b":"<code>alert<\/code>, <code>expr<\/code>, <code>for<\/code>, <code>keep_firing_for<\/code>, <code>labels<\/code>, <code>annotations<\/code>.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-002","d":"alerting","o":"curated","k":"curated","f":"Estados de um alerta no Prometheus: <span class=\"cloze\">[…]<\/span> → <span class=\"cloze\">[…]<\/span> (enquanto o <code>for<\/code> não completou) → <span class=\"cloze\">[…]<\/span>.","b":"Estados de um alerta no Prometheus: <span class=\"cloze-a\">inactive<\/span> → <span class=\"cloze-a\">pending<\/span> (enquanto o <code>for<\/code> não completou) → <span class=\"cloze-a\">firing<\/span>.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-003","d":"alerting","o":"curated","k":"curated","f":"Um alerta <b>sem<\/b> <code>for:<\/code> passa pelo estado pending?","b":"Não. Vai direto para <b>firing<\/b> na primeira avaliação em que a <code>expr<\/code> retorna resultado.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-004","d":"alerting","o":"curated","k":"curated","f":"Para que serve <code>keep_firing_for<\/code>?","b":"Mantém o alerta <b>firing<\/b> por um tempo depois que a <code>expr<\/code> para de retornar. Evita flapping e \"resolved\" falso por uma falha de scrape.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-005","d":"alerting","o":"curated","k":"curated","f":"Como usar os labels e o valor do alerta numa annotation?","b":"<code>{{ $labels.instance }}<\/code>, <code>{{ $value }}<\/code>, <code>{{ $value | humanizePercentage }}<\/code>, <code>{{ $externalLabels.cluster }}<\/code> (templates Go).","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-006","d":"alerting","o":"curated","k":"curated","f":"Labels vs annotations num alerta?","b":"<b>Labels<\/b> identificam o alerta e são usados no <b>roteamento<\/b>, agrupamento e silences (<code>severity<\/code>, <code>team<\/code>). <b>Annotations<\/b> são informação para humanos (<code>summary<\/code>, <code>description<\/code>, <code>runbook_url<\/code>) e não roteiam.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-007","d":"alerting","o":"curated","k":"curated","f":"Convenção de nome de recording rule: <span class=\"cloze\">[…]<\/span>, ex.: <code>job:http_requests:rate5m<\/code>.","b":"Convenção de nome de recording rule: <span class=\"cloze-a\"><code>level:metric:operations<\/code><\/span>, ex.: <code>job:http_requests:rate5m<\/code>.","x":"","s":"<a href=\"../labs/recording-rules-testing/\">labs/recording-rules-testing<\/a>"},{"id":"curated:alert-008","d":"alerting","o":"curated","k":"curated","f":"Para que servem <b>recording rules<\/b>?","b":"Pré-calcular queries <b>caras<\/b> ou muito usadas (dashboards, alertas, SLOs) e gravar o resultado como série nova; também para federar só agregados.","x":"","s":"<a href=\"../labs/recording-rules-testing/\">labs/recording-rules-testing<\/a>"},{"id":"curated:alert-009","d":"alerting","o":"curated","k":"curated","f":"Como são avaliados os <b>grupos<\/b> de regras?","b":"Grupos rodam <b>em paralelo<\/b>, cada um no seu <code>interval<\/code>. As regras <b>dentro<\/b> de um grupo rodam <b>em sequência<\/b>, então uma regra pode usar o resultado da anterior na mesma avaliação.","x":"","s":"<a href=\"../labs/recording-rules-testing/\">labs/recording-rules-testing<\/a>"},{"id":"curated:alert-010","d":"alerting","o":"curated","k":"curated","f":"Como fazer testes unitários de regras?","b":"<code>promtool test rules tests.yml<\/code>, com <code>input_series<\/code> (notação <code>0+10x5<\/code>), <code>alert_rule_test<\/code> (alertas esperados em <code>eval_time<\/code>) e <code>promql_expr_test<\/code>.","x":"","s":"<a href=\"../labs/recording-rules-testing/\">labs/recording-rules-testing<\/a>"},{"id":"curated:alert-011","d":"alerting","o":"curated","k":"curated","f":"Que série o Prometheus grava para os alertas ativos?","b":"<code>ALERTS{alertname, alertstate=\"pending|firing\", ...labels}<\/code> (e <code>ALERTS_FOR_STATE<\/code>, usado para restaurar o <code>for<\/code> após um restart).","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-012","d":"alerting","o":"curated","k":"curated","f":"Quem faz grouping, deduplicação, silences, inibição e roteamento?","b":"O <b>Alertmanager<\/b>. O Prometheus só <b>avalia<\/b> as regras e <b>envia<\/b> (e reenvia periodicamente) os alertas ativos.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-013","d":"alerting","o":"curated","k":"curated","f":"Defaults do Alertmanager: group_wait <span class=\"cloze\">[…]<\/span>, group_interval <span class=\"cloze\">[…]<\/span>, repeat_interval <span class=\"cloze\">[…]<\/span>.","b":"Defaults do Alertmanager: group_wait <span class=\"cloze-a\">30s<\/span>, group_interval <span class=\"cloze-a\">5m<\/span>, repeat_interval <span class=\"cloze-a\">4h<\/span>.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-014","d":"alerting","o":"curated","k":"curated","f":"Diferença entre <code>group_wait<\/code>, <code>group_interval<\/code> e <code>repeat_interval<\/code>?","b":"<ul><li><code>group_wait<\/code>: espera antes da <b>1ª<\/b> notificação de um grupo novo (para juntar alertas)<\/li><li><code>group_interval<\/code>: espera antes de notificar <b>mudanças<\/b> (alertas novos/resolvidos) num grupo já notificado<\/li><li><code>repeat_interval<\/code>: reenvio de um grupo que <b>não mudou<\/b> e continua firing<\/li><\/ul>","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-015","d":"alerting","o":"curated","k":"curated","f":"Como o <b>routing tree<\/b> do Alertmanager escolhe a rota?","b":"Começa na <b>raiz<\/b> (que casa tudo e precisa de <code>receiver<\/code>) e desce (depth-first) pelo <b>primeiro<\/b> filho que casa; para ali, a menos que a rota tenha <code>continue: true<\/code>. Os filhos herdam os parâmetros do pai.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-016","d":"alerting","o":"curated","k":"curated","f":"O que faz <code>group_by: ['...']<\/code>?","b":"Desliga o agrupamento: cada conjunto único de labels vira um grupo próprio (uma notificação por alerta).","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-017","d":"alerting","o":"curated","k":"curated","f":"Como funciona uma <b>inhibition rule<\/b>?","b":"<code>inhibit_rules<\/code> com <code>source_matchers<\/code>, <code>target_matchers<\/code> e <code>equal<\/code>: enquanto um alerta <b>source<\/b> está firing, os alertas <b>target<\/b> com os mesmos valores nos labels de <code>equal<\/code> são suprimidos. Ex.: <code>critical<\/code> inibe <code>warning<\/code> do mesmo <code>cluster<\/code>.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-018","d":"alerting","o":"curated","k":"curated","f":"Silence vs inhibition?","b":"<b>Silence<\/b>: manual, temporário (tem expiração), definido por matchers na UI/<code>amtool<\/code>. <b>Inhibition<\/b>: automática e configurada; depende de <b>outro alerta<\/b> estar firing.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-019","d":"alerting","o":"curated","k":"curated","f":"Onde se cria um <b>silence<\/b>?","b":"No <b>Alertmanager<\/b> (UI <code>:9093<\/code> ou <code>amtool silence add alertname=X --duration=2h -c \"motivo\"<\/code>). O Prometheus não sabe de silences.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-020","d":"alerting","o":"curated","k":"curated","f":"Como funciona a <b>alta disponibilidade<\/b> do Alertmanager?","b":"Várias réplicas em cluster via <b>gossip<\/b> (<code>--cluster.peer<\/code>, porta 9094). Cada Prometheus envia para <b>todas<\/b> as réplicas (sem load balancer); o cluster <b>deduplica<\/b> notificações e replica silences.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-021","d":"alerting","o":"curated","k":"curated","f":"Como validar a config do Alertmanager e testar para qual receiver um alerta iria?","b":"<code>amtool check-config alertmanager.yml<\/code> e <code>amtool config routes test --config.file=alertmanager.yml severity=critical team=db<\/code>.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-022","d":"alerting","o":"curated","k":"curated","f":"Cite receivers do Alertmanager.","b":"<code>email_configs<\/code>, <code>slack_configs<\/code>, <code>pagerduty_configs<\/code>, <code>opsgenie_configs<\/code>, <code>msteams_configs<\/code>, <code>webhook_configs<\/code> (integração genérica via HTTP POST com JSON)...","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-023","d":"alerting","o":"curated","k":"curated","f":"Como silenciar notificações <b>fora do horário comercial<\/b> de forma recorrente?","b":"Defina <code>time_intervals<\/code> e use <code>mute_time_intervals<\/code> (ou <code>active_time_intervals<\/code>) na rota. Não é silence: é configuração da rota.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-024","d":"alerting","o":"curated","k":"curated","f":"O que é <code>$__rate_interval<\/code> no Grafana?","b":"Janela automática para <code>rate<\/code>: pelo menos 4× o scrape interval configurado no data source, ajustada ao step do painel. Use <code>rate(x[$__rate_interval])<\/code>.","x":"","s":"<a href=\"../promql-functions-lab/functions/rate/\">promql-functions-lab/functions/rate<\/a>"},{"id":"curated:alert-025","d":"alerting","o":"curated","k":"curated","f":"Como criar uma variável de dashboard no Grafana com a lista de jobs?","b":"Variável do tipo query: <code>label_values(up, job)<\/code>. No painel: <code>{job=~\"$job\"}<\/code> (regex, por causa do multi-select/All).","x":"","s":""},{"id":"curated:alert-026","d":"alerting","o":"curated","k":"curated","f":"Como o Prometheus sabe para onde enviar os alertas?","b":"Pela seção <code>alerting.alertmanagers<\/code> do <code>prometheus.yml<\/code> (static ou via service discovery). Os alertas vão via <code>POST /api/v2/alerts<\/code>.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-027","d":"alerting","o":"curated","k":"curated","f":"O que são <b>console templates<\/b>?","b":"Páginas HTML em Go templates servidas pelo próprio Prometheus em <code>/consoles<\/code> (flags <code>--web.console.templates<\/code> e <code>--web.console.libraries<\/code>). Hoje o padrão de mercado para dashboards é o <b>Grafana<\/b>.","x":"","s":""},{"id":"curated:alert-028","d":"alerting","o":"curated","k":"curated","f":"Como adicionar o Prometheus como data source no Grafana?","b":"Connections → Data sources → Prometheus → URL do servidor (ex.: <code>http://prometheus:9090<\/code>), acesso pelo backend do Grafana (server/proxy). Configure o <i>scrape interval<\/i> para o <code>$__rate_interval<\/code> ficar correto.","x":"","s":""},{"id":"curated:alert-029","d":"alerting","o":"curated","k":"curated","f":"Por que quase todo alerta deve ter <code>for:<\/code>?","b":"Para não disparar com <b>picos transitórios<\/b> (flapping). O alerta só vai para firing se a condição se mantiver durante todo o <code>for<\/code>.","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"curated:alert-030","d":"alerting","o":"curated","k":"curated","f":"Qual é o erro de colocar um <b>counter cru<\/b> num gráfico?","b":"Ele só sobe (e despenca em restarts): não mostra nada útil. Mostre <code>rate()<\/code> (por segundo) ou <code>increase()<\/code> (total no período).","x":"","s":"<a href=\"../promql-functions-lab/functions/rate/\">promql-functions-lab/functions/rate<\/a>"},{"id":"lab:alertmanager:cola:1","d":"alerting","o":"lab","k":"cola","f":"lab alertmanager · Estados: <code>inactive<\/code> → ?","b":"<code>pending<\/code> (<code>for<\/code>) → <code>firing<\/code>. Só firing/resolved vão ao AM. <code>keep_firing_for<\/code> segura o firing depois que a condição some.","x":"Cola completa: Estados: <code>inactive<\/code> → <code>pending<\/code> (<code>for<\/code>) → <code>firing<\/code>. Só firing/resolved vão ao AM. <code>keep_firing_for<\/code> segura o firing depois que a condição some.","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"lab:alertmanager:cola:2","d":"alerting","o":"lab","k":"cola","f":"lab alertmanager · <span class=\"cloze\">[…]<\/span> e <code>ALERTS_FOR_STATE<\/code> (valor = activeAt).","b":"lab alertmanager · <span class=\"cloze-a\"><code>ALERTS{alertstate}<\/code><\/span> e <code>ALERTS_FOR_STATE<\/code> (valor = activeAt).","x":"","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"lab:alertmanager:cola:3","d":"alerting","o":"lab","k":"cola","f":"lab alertmanager · Templates na regra: ?","b":"<code>{{ $labels.x }}<\/code>, <code>{{ $value | humanizePercentage }}<\/code>. No AM: <code>.CommonLabels<\/code>, <code>.Alerts.Firing<\/code>, <code>.Status<\/code>.","x":"Cola completa: Templates na regra: <code>{{ $labels.x }}<\/code>, <code>{{ $value | humanizePercentage }}<\/code>. No AM: <code>.CommonLabels<\/code>, <code>.Alerts.Firing<\/code>, <code>.Status<\/code>.","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"lab:alertmanager:cola:4","d":"alerting","o":"lab","k":"cola","f":"lab alertmanager · Timers: ?","b":"<code>group_wait<\/code> (grupo novo) · <code>group_interval<\/code> (mudança no grupo) · <code>repeat_interval<\/code> (reenvio) · <code>resolve_timeout<\/code> (sem <code>endsAt<\/code>).","x":"Cola completa: Timers: <code>group_wait<\/code> (grupo novo) · <code>group_interval<\/code> (mudança no grupo) · <code>repeat_interval<\/code> (reenvio) · <code>resolve_timeout<\/code> (sem <code>endsAt<\/code>).","s":"<a href=\"../labs/alertmanager/\">labs/alertmanager<\/a>"},{"id":"lab:alertmanager:cola:5","d":"alerting","o":"lab","k":"cola","f":"lab alertmanager · Roteamento: ?","b":"raiz casa tudo; filhas em ordem; primeira ganha; <code>continue: true<\/ const META = {"domains": [{"key": "observability", "name": "Observability Concepts", "weight": 18}, {"key": "fundamentals", "name": "Prometheus Fundamentals", "weight": 20}, {"key": "promql", "name": "PromQL", "weight": 28}, {"key": "instrumentation", "name": "Instrumentation & Exporters", "weight": 16}, {"key": "alerting", "name": "Alerting & Dashboarding", "weight": 18}], "origins": {"curated": "Curadas", "top15": "Top 15 pegadinhas", "lesson": "Lições PromQL", "lab": "Labs"}};
const KEY = "pca-flashcards-v1";
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){} }
};
const saved = store.load();
const known = new Set(Array.isArray(saved.known) ? saved.known : []);
const st = { domain: saved.domain || "", origin: saved.origin || "", q: "", hideKnown: !!saved.hideKnown, order: null, i: 0, flipped: false };
if (saved.theme) document.documentElement.dataset.theme = saved.theme;
const $ = id => document.getElementById(id);
const persist = () => store.save({ known: [...known], domain: st.domain, origin: st.origin, hideKnown: st.hideKnown, theme: document.documentElement.dataset.theme || "" });
const dmeta = Object.fromEntries(META.domains.map((d,i) => [d.key, {...d, n:i+1}]));

// domain chips
function chips(){
  const box = $("domains"); box.innerHTML = "";
  const all = [{key:"", name:"Todos", n:0}, ...META.domains.map((d,i)=>({...d, n:i+1}))];
  for (const d of all){
    const c = CARDS.filter(x => !d.key || x.d === d.key).length;
    const b = document.createElement("button");
    b.className = "chip"; b.setAttribute("aria-pressed", String(st.domain === d.key));
    b.innerHTML = (d.key ? `<span class="dot" style="background:var(--d-${d.key})"></span>` : "") +
      `${d.name}${d.weight ? ` <small>${d.weight}%</small>` : ""} <small>· ${c}</small>`;
    b.title = `tecla ${d.n}`;
    b.onclick = () => { st.domain = d.key; refilter(); };
    box.appendChild(b);
  }
}
for (const [k,v] of Object.entries(META.origins)){
  const o = document.createElement("option"); o.value = k; o.textContent = v; $("origin").appendChild(o);
}

function strip(h){ const d = document.createElement("div"); d.innerHTML = h; return d.textContent.toLowerCase(); }
const hay = CARDS.map(c => strip(c.f + " " + c.b + " " + c.x));

function filtered(){
  const q = st.q.trim().toLowerCase();
  const out = [];
  CARDS.forEach((c, idx) => {
    if (st.domain && c.d !== st.domain) return;
    if (st.origin && c.o !== st.origin) return;
    if (st.hideKnown && known.has(c.id)) return;
    if (q && !hay[idx].includes(q)) return;
    out.push(idx);
  });
  return out;
}
function refilter(keepPos){
  const cur = st.order && st.order[st.i];
  st.order = filtered();
  if (st.shuffled) shuffleArr(st.order);
  st.i = keepPos ? Math.max(0, st.order.indexOf(cur)) : 0;
  if (st.i >= st.order.length) st.i = 0;
  st.flipped = false; persist(); chips(); show(); renderList();
}
function shuffleArr(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }

function metaHtml(c){
  const d = dmeta[c.d];
  return `<span class="dom" style="color:var(--d-${c.d})">${d.name}</span><span>· ${META.origins[c.o]}</span>` +
    (known.has(c.id) ? `<span class="known">✓ conhecida</span>` : "");
}
function show(){
  const n = st.order.length, card = $("card");
  $("empty").hidden = n > 0; card.hidden = n === 0;
  const inFilter = CARDS.filter(c => (!st.domain || c.d === st.domain) && (!st.origin || c.o === st.origin));
  const k = inFilter.filter(c => known.has(c.id)).length;
  $("knownStat").textContent = `${k}/${inFilter.length} conhecidas`;
  $("pbar").style.width = inFilter.length ? (100 * k / inFilter.length) + "%" : "0";
  if (!n){ $("pos").textContent = "0 cards"; return; }
  const c = CARDS[st.order[st.i]];
  $("pos").textContent = `card ${st.i + 1} de ${n}${st.shuffled ? " (embaralhado)" : ""}`;
  $("mf").innerHTML = metaHtml(c); $("mb").innerHTML = metaHtml(c);
  $("cf").innerHTML = c.f;
  $("cb").innerHTML = `<div class="q-mini">${c.f}</div>` + c.b +
    (c.x ? `<div class="extra">${c.x}</div>` : "") + (c.s ? `<div class="src">📎 ${c.s}</div>` : "");
  card.classList.toggle("flipped", st.flipped);
  $("knownBtn").textContent = known.has(c.id) ? "✗ Desmarcar" : "✓ Conhecida";
}
function renderList(){
  if (!document.body.classList.contains("listmode") && !st.printing) { $("list").innerHTML = ""; return; }
  $("list").innerHTML = st.order.map((idx, n) => { const c = CARDS[idx];
    return `<div class="item"><div class="meta">${metaHtml(c)}<span>#${n+1}</span></div><div class="q">${c.f}</div><div class="a">${c.b}${c.x ? `<div class="extra">${c.x}</div>` : ""}${c.s ? `<div class="src">📎 ${c.s}</div>` : ""}</div></div>`; }).join("");
}
const flip = () => { st.flipped = !st.flipped; show(); };
const go = d => { if (!st.order.length) return; st.i = (st.i + d + st.order.length) % st.order.length; st.flipped = false; show(); };
function toggleKnown(){
  if (!st.order.length) return;
  const c = CARDS[st.order[st.i]];
  if (known.has(c.id)) { known.delete(c.id); persist(); show(); return; }
  known.add(c.id); persist();
  if (st.hideKnown){ st.order.splice(st.i, 1); if (st.i >= st.order.length) st.i = 0; st.flipped = false; show(); }
  else go(1);
}
function shuffle(){ st.shuffled = true; shuffleArr(st.order); st.i = 0; st.flipped = false; show(); renderList(); }
function toggleView(){ document.body.classList.toggle("listmode"); renderList(); }
function toggleTheme(){
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark"; persist();
}

$("card").onclick = e => { if (e.target.closest("a")) return; flip(); };
$("flipBtn").onclick = flip; $("nextBtn").onclick = () => go(1); $("prevBtn").onclick = () => go(-1);
$("knownBtn").onclick = toggleKnown; $("shuffleBtn").onclick = shuffle; $("viewBtn").onclick = toggleView;
$("themeBtn").onclick = toggleTheme;
$("printBtn").onclick = () => { st.printing = true; renderList(); setTimeout(() => window.print(), 50); };
window.addEventListener("afterprint", () => { st.printing = false; renderList(); });
window.addEventListener("beforeprint", () => { st.printing = true; renderList(); });
$("resetBtn").onclick = () => { if (confirm("Esquecer todas as cards marcadas como conhecidas?")) { known.clear(); refilter(); } };
$("origin").value = st.origin; $("origin").onchange = e => { st.origin = e.target.value; refilter(); };
$("hideKnown").checked = st.hideKnown; $("hideKnown").onchange = e => { st.hideKnown = e.target.checked; refilter(true); };
$("search").oninput = e => { st.q = e.target.value; refilter(); };

document.addEventListener("keydown", e => {
  if (e.target.matches("input,select,textarea")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === " " || k === "Enter") { e.preventDefault(); flip(); }
  else if (k === "ArrowRight" || k === "l") go(1);
  else if (k === "ArrowLeft" || k === "h") go(-1);
  else if (k === "k") toggleKnown();
  else if (k === "s") shuffle();
  else if (k === "u") { st.hideKnown = !st.hideKnown; $("hideKnown").checked = st.hideKnown; refilter(true); }
  else if (k === "v") toggleView();
  else if (k === "t") toggleTheme();
  else if (k === "/") { e.preventDefault(); $("search").focus(); }
  else if (/^[0-5]$/.test(k)) { st.domain = k === "0" ? "" : (META.domains[+k - 1] || {}).key || ""; refilter(); }
});
// deep link: flashcards.html#q=group_wait&d=alerting&flip
(function(){ try {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has("q")) { st.q = h.get("q"); $("search").value = st.q; }
  if (h.has("d")) st.domain = h.get("d");
  if (h.has("o")) { st.origin = h.get("o"); $("origin").value = st.origin; }
  refilter();
  if (h.has("flip")) { st.flipped = true; show(); }
  if (h.has("list")) toggleView();
} catch(e) { refilter(); } })();
</script>
