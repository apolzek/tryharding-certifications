<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCA Flashcards</title>
<meta name="description" content="Flashcards offline para a Prometheus Certified Associate: 1256 cards gerados de flashcards/tools/build.py">
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#efeee9; --text:#1b1f24; --muted:#5d6570;
  --border:#dcdad3; --accent:#c2410c; --accent-soft:#fde7dc; --ok:#15803d; --ok-soft:#dcf3e3;
  --cloze:#0a64d8; --code-bg:rgba(120,120,120,.14); --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
  --d-observability:#7c3aed; --d-fundamentals:#0369a1; --d-promql:#c2410c; --d-instrumentation:#15803d; --d-alerting:#b91c1c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141517; --surface:#1d1f22; --surface-2:#26282c; --text:#e7e6e2; --muted:#a2a7ae;
    --border:#34373c; --accent:#fb923c; --accent-soft:#3a2418; --ok:#4ade80; --ok-soft:#153222;
    --cloze:#6fb1ff; --code-bg:rgba(200,200,200,.12); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --d-observability:#a78bfa; --d-fundamentals:#38bdf8; --d-promql:#fb923c; --d-instrumentation:#4ade80; --d-alerting:#f87171;
  }
}
:root[data-theme="dark"]{
    --bg:#141517; --surface:#1d1f22; --surface-2:#26282c; --text:#e7e6e2; --muted:#a2a7ae;
    --border:#34373c; --accent:#fb923c; --accent-soft:#3a2418; --ok:#4ade80; --ok-soft:#153222;
    --cloze:#6fb1ff; --code-bg:rgba(200,200,200,.12); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --d-observability:#a78bfa; --d-fundamentals:#38bdf8; --d-promql:#fb923c; --d-instrumentation:#4ade80; --d-alerting:#f87171;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--cloze)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--code-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre{background:var(--code-bg);padding:10px;border-radius:8px;overflow:auto;font-size:.85em}
pre code{background:none;padding:0}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header h1{font-size:1.35rem;margin:0 0 2px}
header p{margin:0;color:var(--muted);font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 8px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip small{opacity:.7}
select,input[type=search]{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:.9rem}
input[type=search]{flex:1;min-width:160px}
label.tg{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;color:var(--muted);cursor:pointer}
button.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 12px;font:inherit;font-size:.9rem;cursor:pointer}
button.btn:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.progress>div{height:100%;background:var(--ok);width:0;transition:width .3s}
.status{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;gap:8px;flex-wrap:wrap}
/* flip card */
.stage{perspective:1600px;margin:14px 0}
.card{position:relative;min-height:320px;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px 18px;display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg)}
.meta{display:flex;gap:8px;align-items:center;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.meta .dom{font-weight:700}
.meta .known{margin-left:auto;color:var(--ok);font-weight:700}
.content{font-size:1.15rem;flex:1}
.content ul{padding-left:1.2em}
.q-mini{color:var(--muted);font-size:.9rem;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border)}
.cloze{font-weight:700;color:var(--cloze)}
.cloze-a{font-weight:700;color:var(--cloze);background:var(--code-bg);border-radius:4px;padding:0 3px}
.extra{margin-top:14px;font-size:.9rem;color:var(--muted)}
.src{margin-top:12px;font-size:.78rem;color:var(--muted)}
.hint{color:var(--muted);font-size:.8rem;text-align:center;margin-top:auto;padding-top:10px}
.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:60px 10px}
.keys{color:var(--muted);font-size:.8rem;margin-top:18px;line-height:1.9}
kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:.78rem;background:var(--surface)}
/* list view (and print) */
.list{display:none}
body.listmode .list{display:block}
body.listmode .stage, body.listmode .nav{display:none}
.item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin:8px 0;break-inside:avoid}
.item .q{font-weight:600}
.item .a{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
.item .meta{margin-bottom:4px}
@media (max-width:560px){
  .face{padding:16px}
  .content{font-size:1.02rem}
  .card{min-height:360px}
}
@media print{
  body{background:#fff;color:#000}
  header p,.bar,.progress,.status,.stage,.nav,.keys,#themeBtn{display:none!important}
  .list{display:block!important}
  .item{border-color:#999;box-shadow:none}
  a{color:#000}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:start">
      <div>
        <h1>PCA Flashcards</h1>
        <p><span id="total">1256</span> cards · Prometheus Certified Associate · offline</p>
      </div>
      <button class="btn" id="themeBtn" title="Alternar tema (t)">◐</button>
    </div>
  </header>

  <div class="bar" id="domains" role="group" aria-label="Filtrar por domínio"></div>
  <div class="bar">
    <select id="origin" aria-label="Origem">
      <option value="">Todas as origens</option>
    </select>
    <input type="search" id="search" placeholder="Buscar (ex.: group_wait, rate, relabel)…" aria-label="Buscar">
    <label class="tg"><input type="checkbox" id="hideKnown"> ocultar conhecidas</label>
  </div>
  <div class="bar">
    <button class="btn" id="shuffleBtn">🔀 Embaralhar</button>
    <button class="btn" id="viewBtn">☰ Lista / imprimir</button>
    <button class="btn" id="printBtn">🖨 Imprimir</button>
    <button class="btn" id="resetBtn" title="Esquecer as marcadas como conhecidas">↺ Zerar conhecidas</button>
  </div>

  <div class="progress" aria-hidden="true"><div id="pbar"></div></div>
  <div class="status"><span id="pos">–</span><span id="knownStat">–</span></div>

  <div class="stage">
    <div class="card" id="card" tabindex="0" aria-live="polite">
      <div class="face front"><div class="meta" id="mf"></div><div class="content" id="cf"></div><div class="hint">clique ou <kbd>espaço</kbd> para virar</div></div>
      <div class="face back"><div class="meta" id="mb"></div><div class="content" id="cb"></div></div>
    </div>
    <div class="empty" id="empty" hidden>Nenhum card com esses filtros. 🎉</div>
  </div>
  <div class="nav">
    <button class="btn" id="prevBtn">← Anterior</button>
    <button class="btn primary" id="flipBtn">Virar</button>
    <button class="btn ok" id="knownBtn">✓ Conhecida</button>
    <button class="btn" id="nextBtn">Próxima →</button>
  </div>

  <div class="list" id="list"></div>

  <div class="keys">
    <kbd>espaço</kbd>/<kbd>enter</kbd> virar · <kbd>→</kbd>/<kbd>l</kbd> próxima · <kbd>←</kbd>/<kbd>h</kbd> anterior ·
    <kbd>k</kbd> conhecida (marca e avança) · <kbd>s</kbd> embaralhar · <kbd>u</kbd> ocultar conhecidas ·
    <kbd>0</kbd>–<kbd>5</kbd> domínio · <kbd>/</kbd> buscar · <kbd>v</kbd> lista · <kbd>t</kbd> tema
  </div>
</div>

<script>
const CARDS = [{"id":"curated:obs-001","d":"observability","o":"curated","k":"curated","f":"Quais são os três pilares da observabilidade, e qual deles o Prometheus cobre?","b":"<b>Métricas<\/b> (numéricas, agregadas, baratas: o Prometheus), <b>logs<\/b> (eventos detalhados: Loki/ELK) e <b>traces<\/b> (caminho de uma requisição entre serviços: Tempo/Jaeger).","x":"","s":""},{"id":"curated:obs-002","d":"observability","o":"curated","k":"curated","f":"Quando métricas são melhores que logs?","b":"Para <b>tendências, agregação e alertas<\/b>, com custo fixo por série (independe do volume de eventos). Logs servem para detalhes de <b>eventos individuais<\/b> e dados de alta cardinalidade.","x":"","s":""},{"id":"curated:obs-003","d":"observability","o":"curated","k":"curated","f":"Vantagens do modelo <b>pull<\/b>?","b":"<ul><li>Detecta target fora do ar (<code>up == 0<\/code>)<\/li><li>O servidor controla a taxa de coleta<\/li><li>Fácil depurar (abrir <code>/metrics<\/code> no navegador) e rodar uma 2ª instância<\/li><li>O target não precisa saber para onde enviar<\/li><\/ul>","x":"","s":""},{"id":"curated:obs-004","d":"observability","o":"curated","k":"curated","f":"Quando o <b>push<\/b> é apropriado no ecossistema Prometheus?","b":"<b>Jobs batch de curta duração<\/b> (service-level), que terminam antes de serem raspados, via Pushgateway. Não use push para serviços de longa duração.","x":"","s":"<a href=\"../labs/exporters-pushgateway/\">labs/exporters-pushgateway<\/a>"},{"id":"curated:obs-005","d":"observability","o":"curated","k":"curated","f":"Monitoramento <b>white-box<\/b> vs <b>black-box<\/b>?","b":"<b>White-box<\/b>: métricas internas expostas pela instrumentação da app. <b>Black-box<\/b>: sondar de fora como um usuário (ex.: blackbox_exporter → <code>probe_success<\/code>).","x":"","s":"<a href=\"../labs/exporters-pushgateway/\">labs/exporters-pushgateway<\/a>"},{"id":"curated:obs-006","d":"observability","o":"curated","k":"curated","f":"Método <b>RED<\/b> (para <span class=\"cloze\">[…]<\/span>): <span class=\"cloze\">[…]<\/span>, <span class=\"cloze\">[…]<\/span>, <span class=\"cloze\">[…]<\/span>.","b":"Método <b>RED<\/b> (para <span class=\"cloze-a\">serviços<\/span>): <span class=\"cloze-a\">Rate<\/span>, <span class=\"cloze-a\">Errors<\/span>, <span class=\"cloze-a\">Duration<\/span>.","x":"","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"curated:obs-007","d":"observability","o":"curated","k":"curated","f":"Método <b>USE<\/b> (para <span class=\"cloze\">[…]<\/span>: CPU, disco, rede): <span class=\"cloze\">[…]<\/span>, <span class=\"cloze\">[…]<\/span>, <span class=\"cloze\">[…]<\/span>.","b":"Método <b>USE<\/b> (para <span class=\"cloze-a\">recursos<\/span>: CPU, disco, rede): <span class=\"cloze-a\">Utilization<\/span>, <span class=\"cloze-a\">Saturation<\/span>, <span class=\"cloze-a\">Errors<\/span>.","x":"","s":""},{"id":"curated:obs-008","d":"observability","o":"curated","k":"curated","f":"Quais são os <b>Four Golden Signals<\/b> (Google SRE)?","b":"<b>Latency<\/b>, <b>Traffic<\/b>, <b>Errors<\/b>, <b>Saturation<\/b>.","x":"","s":""},{"id":"curated:obs-009","d":"observability","o":"curated","k":"curated","f":"SLI vs SLO vs SLA?","b":"<ul><li><b>SLI<\/b>: indicador medido (ex.: requisições boas ÷ total)<\/li><li><b>SLO<\/b>: meta interna para o SLI (ex.: 99,9% em 30 dias)<\/li><li><b>SLA<\/b>: contrato com consequência (multa/crédito); normalmente mais frouxo que o SLO<\/li><\/ul>","x":"","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"curated:obs-010","d":"observability","o":"curated","k":"curated","f":"Qual é o <b>error budget<\/b> de um SLO de 99,9% em 30 dias?","b":"1 − 0,999 = <b>0,1%<\/b>. Em tempo: 0,001 × 43.200 min = <b>43,2 min<\/b> de indisponibilidade.","x":"","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"curated:obs-011","d":"observability","o":"curated","k":"curated","f":"Indisponibilidade permitida em 30 dias: 99% → <span class=\"cloze\">[…]<\/span>; 99,9% → <span class=\"cloze\">[…]<\/span>; 99,99% → <span class=\"cloze\">[…]<\/span>.","b":"Indisponibilidade permitida em 30 dias: 99% → <span class=\"cloze-a\">7,2 h<\/span>; 99,9% → <span class=\"cloze-a\">43,2 min<\/span>; 99,99% → <span class=\"cloze-a\">4,32 min<\/span>.","x":"","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"curated:obs-012","d":"observability","o":"curated","k":"curated","f":"O que é <b>burn rate<\/b>?","b":"Velocidade de consumo do error budget em relação ao ritmo \"ideal\". Burn rate <b>1<\/b> gasta o budget exatamente no período do SLO; <b>14,4<\/b> mantido por 1 h consome <b>2%<\/b> de um budget de 30 dias.","x":"","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"curated:obs-013","d":"observability","o":"curated","k":"curated","f":"Por que alertas de SLO usam <b>multi-window, multi-burn-rate<\/b>?","b":"A janela <b>longa<\/b> (ex.: 1 h) dá significância (evita alarme por ruído); a <b>curta<\/b> (ex.: 5 m) faz o alerta parar logo que o problema acaba. Ex.: page se burn rate &gt; 14,4 em 1 h <b>e<\/b> em 5 m.","x":"","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"curated:obs-014","d":"observability","o":"curated","k":"curated","f":"Alertar em <b>sintomas<\/b> ou em <b>causas<\/b>?","b":"Em <b>sintomas<\/b> (o que o usuário sente: erros, latência, indisponibilidade). Causas (CPU alta, disco) vão para dashboards/tickets, ou viram alertas só quando preveem um sintoma.","x":"","s":""},{"id":"curated:obs-015","d":"observability","o":"curated","k":"curated","f":"Por que a <b>média<\/b> de latência engana?","b":"Esconde a <b>cauda<\/b>: poucos usuários muito lentos somem na média. Use percentis (p95/p99) via histogram: <code>histogram_quantile<\/code>.","x":"","s":"<a href=\"../promql-functions-lab/functions/histogram_quantile/\">promql-functions-lab/functions/histogram_quantile<\/a>"},{"id":"curated:obs-016","d":"observability","o":"curated","k":"curated","f":"O que é <b>cardinalidade<\/b> e por que importa?","b":"Número de séries únicas = combinações de valores de labels. Labels como <code>user_id<\/code>, email, IP ou URL com IDs <b>explodem<\/b> memória e disco.","x":"","s":""},{"id":"curated:obs-017","d":"observability","o":"curated","k":"curated","f":"O que são <b>exemplars<\/b>?","b":"Amostras com um <b>trace ID<\/b> anexado a um bucket/counter: permitem pular de um pico no gráfico para um trace concreto. Vêm via OpenMetrics; armazenamento com <code>--enable-feature=exemplar-storage<\/code>.","x":"","s":""},{"id":"curated:obs-018","d":"observability","o":"curated","k":"curated","f":"O que é um <b>trace<\/b> e um <b>span<\/b>?","b":"<b>Trace<\/b>: árvore de spans de uma requisição ponta a ponta. <b>Span<\/b>: uma operação (nome, início, duração, <code>trace_id<\/code>, <code>span_id<\/code>, pai). O contexto é propagado entre serviços (W3C <code>traceparent<\/code>).","x":"","s":""},{"id":"curated:obs-019","d":"observability","o":"curated","k":"curated","f":"Qual a relação entre OpenTelemetry e Prometheus?","b":"O OTel é o padrão aberto de instrumentação (API/SDK/Collector) para métricas, logs e traces. O Prometheus pode <b>receber OTLP<\/b> (<code>--web.enable-otlp-receiver<\/code>) ou raspar o endpoint Prometheus do SDK/Collector.","x":"","s":""},{"id":"curated:obs-020","d":"observability","o":"curated","k":"curated","f":"Monitoramento vs observabilidade?","b":"<b>Monitoramento<\/b> responde perguntas <b>conhecidas<\/b> (dashboards/alertas pré-definidos). <b>Observabilidade<\/b> é a capacidade de responder perguntas <b>novas<\/b> a partir dos sinais que o sistema emite.","x":"","s":""},{"id":"curated:obs-021","d":"observability","o":"curated","k":"curated","f":"Por que não usar o Prometheus para <b>faturamento<\/b> (billing)?","b":"Os dados são <b>amostrados<\/b> por scrape, <code>rate<\/code>/<code>increase<\/code> <b>extrapolam<\/b>, e scrapes podem falhar. Não é 100% exato. Para cobrança, use um sistema de eventos/logs.","x":"","s":""},{"id":"curated:obs-022","d":"observability","o":"curated","k":"curated","f":"SLI de <b>disponibilidade<\/b> em PromQL?","b":"<code>sum(rate(http_requests_total{code!~\"5..\"}[5m])) / sum(rate(http_requests_total[5m]))<\/code>: fração de requisições boas.","x":"","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"curated:obs-023","d":"observability","o":"curated","k":"curated","f":"SLI de <b>latência<\/b> em PromQL (ex.: % de requisições &lt; 300 ms)?","b":"<code>sum(rate(http_request_duration_seconds_bucket{le=\"0.3\"}[5m])) / sum(rate(http_request_duration_seconds_count[5m]))<\/code>. Para isso ser exato, é preciso ter um bucket <b>exatamente<\/b> no limiar.","x":"","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"curated:obs-024","d":"observability","o":"curated","k":"curated","f":"O error budget acabou. O que a política de SLO costuma prever?","b":"<b>Congelar<\/b> releases de features e priorizar confiabilidade até o budget se recuperar.","x":"","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"curated:obs-025","d":"observability","o":"curated","k":"curated","f":"Métricas, logs e traces: qual responde \"<b>qual<\/b> serviço na cadeia está lento para <b>esta<\/b> requisição\"?","b":"<b>Traces.<\/b> As métricas mostram que a latência subiu; os traces mostram onde o tempo foi gasto em uma requisição específica.","x":"","s":""},{"id":"lab:slo-end-to-end:cola:1","d":"observability","o":"lab","k":"cola","f":"lab slo-end-to-end · SLI = ?","b":"bons/válidos (ou ruins/válidos) · SLO = meta numa janela · SLA = contrato · budget = <code>1 - SLO<\/code>.","x":"Cola completa: SLI = bons/válidos (ou ruins/válidos) · SLO = meta numa janela · SLA = contrato · budget = <code>1 - SLO<\/code>.","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:cola:2","d":"observability","o":"lab","k":"cola","f":"lab slo-end-to-end · 99% → ?","b":"7,2h/30d · 99,9% → 43,2 min · 99,95% → 21,6 min · 99,99% → 4,3 min.","x":"Cola completa: 99% → 7,2h/30d · 99,9% → 43,2 min · 99,95% → 21,6 min · 99,99% → 4,3 min.","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:cola:3","d":"observability","o":"lab","k":"cola","f":"lab slo-end-to-end · Razão de erro: ?","b":"<code>sum by (job)(rate(bad[w])) / sum by (job)(rate(total[w]))<\/code> em recording rules <code>job:slo_errors_per_request:ratio_rate&lt;w&gt;<\/code>.","x":"Cola completa: Razão de erro: <code>sum by (job)(rate(bad[w])) / sum by (job)(rate(total[w]))<\/code> em recording rules <code>job:slo_errors_per_request:ratio_rate&lt;w&gt;<\/code>.","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:cola:4","d":"observability","o":"lab","k":"cola","f":"lab slo-end-to-end · Burn rate = ?","b":"razão / budget. Gasto = burn × janela / período. Tempo até zerar = período / burn.","x":"Cola completa: Burn rate = razão / budget. Gasto = burn × janela / período. Tempo até zerar = período / burn.","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:cola:5","d":"observability","o":"lab","k":"cola","f":"lab slo-end-to-end · Workbook (30d): <span class=\"cloze\">[…]<\/span> · <span class=\"cloze\">[…]<\/span> · <span class=\"cloze\">[…]<\/span> · <span class=\"cloze\">[…]<\/span>. Janela curta = longa/12.","b":"lab slo-end-to-end · Workbook (30d): <span class=\"cloze-a\">14,4x 1h&amp;5m page<\/span> · <span class=\"cloze-a\">6x 6h&amp;30m page<\/span> · <span class=\"cloze-a\">3x 1d&amp;2h ticket<\/span> · <span class=\"cloze-a\">1x 3d&amp;6h ticket<\/span>. Janela curta = longa/12.","x":"","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:cola:6","d":"observability","o":"lab","k":"cola","f":"lab slo-end-to-end · Latência: ?","b":"<code>rate(x_bucket{le=\"0.3\"}) / rate(x_count)<\/code> ou <code>histogram_fraction(0, 0.3, ...)<\/code>. Precisa de bucket no limiar.","x":"Cola completa: Latência: <code>rate(x_bucket{le=\"0.3\"}) / rate(x_count)<\/code> ou <code>histogram_fraction(0, 0.3, ...)<\/code>. Precisa de bucket no limiar.","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:cola:7","d":"observability","o":"lab","k":"cola","f":"lab slo-end-to-end · Estados: inactive → ?","b":"pending (<code>for<\/code>) → firing. <code>ALERTS{alertname, alertstate}<\/code>. Teste com <code>promtool test rules<\/code>.","x":"Cola completa: Estados: inactive → pending (<code>for<\/code>) → firing. <code>ALERTS{alertname, alertstate}<\/code>. Teste com <code>promtool test rules<\/code>.","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:cola:8","d":"observability","o":"lab","k":"cola","f":"lab slo-end-to-end · Ferramentas que geram tudo isso: ?","b":"Sloth, Pyrra, OpenSLO, Grafana SLO.","x":"Cola completa: Ferramentas que geram tudo isso: Sloth, Pyrra, OpenSLO, Grafana SLO.","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:pegadinha:1","d":"observability","o":"lab","k":"pegadinha","f":"⚠️ lab slo-end-to-end: pegadinha «SLO de 100% não existe». O que acontece / por quê?","b":"Budget zero = qualquer deploy é violação. E o usuário não percebe a diferença entre 99,99% e 100% (a rede dele falha mais que isso).","x":"Cola completa: <b>SLO de 100% não existe.<\/b> Budget zero = qualquer deploy é violação. E o usuário não percebe a diferença entre 99,99% e 100% (a rede dele falha mais que isso).","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:pegadinha:2","d":"observability","o":"lab","k":"pegadinha","f":"⚠️ lab slo-end-to-end: pegadinha «SLA ≠ SLO». O que acontece / por quê?","b":"SLA tem consequência contratual e é mais frouxo. O SLO é interno e mais apertado, para você agir antes do SLA.","x":"Cola completa: <b>SLA ≠ SLO.<\/b> SLA tem consequência contratual e é mais frouxo. O SLO é interno e mais apertado, para você agir antes do SLA.","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:pegadinha:3","d":"observability","o":"lab","k":"pegadinha","f":"⚠️ lab slo-end-to-end: pegadinha «Série de erro inexistente». O que acontece / por quê?","b":"Se <code>http_requests_total{code=\"500\"}<\/code> só aparece no primeiro erro, a razão fica <b>vazia<\/b> (não 0) e o alerta nunca avalia. Inicialize os labels com 0 (o app deste lab faz <code>WithLabelValues(\"…\",\"500\")<\/code> no início).","x":"Cola completa: <b>Série de erro inexistente.<\/b> Se <code>http_requests_total{code=\"500\"}<\/code> só aparece no primeiro erro, a razão fica <b>vazia<\/b> (não 0) e o alerta nunca avalia. Inicialize os labels com 0 (o app deste lab faz <code>WithLabelValues(\"…\",\"500\")<\/code> no início).","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:pegadinha:4","d":"observability","o":"lab","k":"pegadinha","f":"⚠️ lab slo-end-to-end: pegadinha «Média de razões ≠ razão de somas». O que acontece / por quê?","b":"<code>avg_over_time(ratio_rate5m[30d])<\/code> dá peso igual à madrugada e ao pico. Use <code>sum(rate(bad[30d])) / sum(rate(total[30d]))<\/code>.","x":"Cola completa: <b>Média de razões ≠ razão de somas.<\/b> <code>avg_over_time(ratio_rate5m[30d])<\/code> dá peso igual à madrugada e ao pico. Use <code>sum(rate(bad[30d])) / sum(rate(total[30d]))<\/code>.","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:pegadinha:5","d":"observability","o":"lab","k":"pegadinha","f":"⚠️ lab slo-end-to-end: pegadinha «4xx conta?». O que acontece / por quê?","b":"Normalmente não (erro do cliente). Mas <code>429<\/code> por <i>rate limiting<\/i> seu talvez conte. Decida e documente.","x":"Cola completa: <b>4xx conta?<\/b> Normalmente não (erro do cliente). Mas <code>429<\/code> por <i>rate limiting<\/i> seu talvez conte. Decida e documente.","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:pegadinha:6","d":"observability","o":"lab","k":"pegadinha","f":"⚠️ lab slo-end-to-end: pegadinha «Sem tráfego = sem SLI». O que acontece / por quê?","b":"Serviço fora do ar que não recebe requisição nenhuma tem razão de erro <b>vazia<\/b>, e os alertas de burn rate ficam quietos. Complemente com <code>absent()<\/code>/<code>up == 0<\/code> ou SLI via blackbox (sondas sintéticas).","x":"Cola completa: <b>Sem tráfego = sem SLI.<\/b> Serviço fora do ar que não recebe requisição nenhuma tem razão de erro <b>vazia<\/b>, e os alertas de burn rate ficam quietos. Complemente com <code>absent()<\/code>/<code>up == 0<\/code> ou SLI via blackbox (sondas sintéticas).","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:pegadinha:7","d":"observability","o":"lab","k":"pegadinha","f":"⚠️ lab slo-end-to-end: pegadinha «Bucket no limiar». O que acontece / por quê?","b":"O SLO de latência por razão de buckets só é exato se existir <code>le<\/code> <b>exatamente<\/b> no limiar (aqui, <code>0.3<\/code>). Mudou o SLO para 250ms e não tem bucket? Estimativa (ou native histograms).","x":"Cola completa: <b>Bucket no limiar.<\/b> O SLO de latência por razão de buckets só é exato se existir <code>le<\/code> <b>exatamente<\/b> no limiar (aqui, <code>0.3<\/code>). Mudou o SLO para 250ms e não tem bucket? Estimativa (ou native histograms).","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:pegadinha:8","d":"observability","o":"lab","k":"pegadinha","f":"⚠️ lab slo-end-to-end: pegadinha «Percentil não é SLI». O que acontece / por quê?","b":"<code>histogram_quantile(0.99, …) &lt; 0.3<\/code> responde sim/não por janela; não conta eventos e não gera budget.","x":"Cola completa: <b>Percentil não é SLI.<\/b> <code>histogram_quantile(0.99, …) &lt; 0.3<\/code> responde sim/não por janela; não conta eventos e não gera budget.","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:pegadinha:9","d":"observability","o":"lab","k":"pegadinha","f":"⚠️ lab slo-end-to-end: pegadinha «Janela curta sozinha = barulho; janela longa sozinha = alerta que não para». O que acontece / por quê?","b":"Por isso o <code>and<\/code> das duas.","x":"Cola completa: <b>Janela curta sozinha = barulho; janela longa sozinha = alerta que não para.<\/b> Por isso o <code>and<\/code> das duas.","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"lab:slo-end-to-end:pegadinha:10","d":"observability","o":"lab","k":"pegadinha","f":"⚠️ lab slo-end-to-end: pegadinha «Burn rates dependem do período do SLO». O que acontece / por quê?","b":"14,4 vem de \"2% de 30 dias em 1h\". Para um SLO de 7 dias, recalcule (<code>0,02 × 168h / 1h = 3,36<\/code>).","x":"Cola completa: <b>Burn rates dependem do período do SLO.<\/b> 14,4 vem de \"2% de 30 dias em 1h\". Para um SLO de 7 dias, recalcule (<code>0,02 × 168h / 1h = 3,36<\/code>).","s":"<a href=\"../labs/slo-end-to-end/\">labs/slo-end-to-end<\/a>"},{"id":"curated:fund-001","d":"fundamentals","o":"curated","k":"curated","f":"Quais são os componentes internos de um servidor Prometheus?","b":"<ul><li><b>Retrieval<\/b>: service discovery + scrape<\/li><li><b>TSDB<\/b> local<\/li><li><b>PromQL engine<\/b> + HTTP API/UI (<code>:9090<\/code>)<\/li><li><b>Rule manager<\/b>: recording/alerting rules; envia alertas ao Alertmanager<\/li><\/ul>","x":"","s":""},{"id":"curated:fund-002","d":"fundamentals","o":"curated","k":"curated","f":"Qual é o modelo de coleta padrão do Prometheus?","b":"<b>Pull<\/b>: HTTP GET em <code>/metrics<\/code> de cada target. Push só como exceção: Pushgateway (e receivers de remote write/OTLP).","x":"","s":""},{"id":"curated:fund-003","d":"fundamentals","o":"curated","k":"curated","f":"Defaults do <code>global<\/code>: scrape_interval <span class=\"cloze\">[…]<\/span>, scrape_timeout <span class=\"cloze\">[…]<\/span>, evaluation_interval <span class=\"cloze\">[…]<\/span>.","b":"Defaults do <code>global<\/code>: scrape_interval <span class=\"cloze-a\">1m<\/span>, scrape_timeout <span class=\"cloze-a\">10s<\/span>, evaluation_interval <span class=\"cloze-a\">1m<\/span>.","x":"","s":"<a href=\"https://prometheus.io/docs/prometheus/latest/configuration/configuration/\">https://prometheus.io/docs/prometheus/latest/configuration/configuration<\/a>"},{"id":"curated:fund-004","d":"fundamentals","o":"curated","k":"curated","f":"Quais labels todo target recebe automaticamente?","b":"<code>job<\/code> (vem do <code>job_name<\/code>) e <code>instance<\/code> (vem do <code>__address__<\/code> após o relabeling).","x":"","s":""},{"id":"curated:fund-005","d":"fundamentals","o":"curated","k":"curated","f":"Quais séries o Prometheus gera sozinho a cada scrape?","b":"<code>up<\/code> (1 = scrape ok, 0 = falhou), <code>scrape_duration_seconds<\/code>, <code>scrape_samples_scraped<\/code>, <code>scrape_samples_post_metric_relabeling<\/code>, <code>scrape_series_added<\/code>.","x":"","s":""},{"id":"curated:fund-006","d":"fundamentals","o":"curated","k":"curated","f":"Seções de topo do <code>prometheus.yml<\/code>?","b":"<code>global<\/code>, <code>rule_files<\/code>, <code>scrape_configs<\/code>, <code>alerting<\/code>, <code>remote_write<\/code>, <code>remote_read<\/code> (além de <code>storage<\/code>, <code>tracing<\/code>, <code>scrape_config_files<\/code>...).","x":"","s":""},{"id":"curated:fund-007","d":"fundamentals","o":"curated","k":"curated","f":"Como recarregar a configuração sem reiniciar o Prometheus?","b":"<code>kill -HUP &lt;pid&gt;<\/code> ou <code>curl -X POST :9090/-/reload<\/code> (exige <code>--web.enable-lifecycle<\/code>). Se a nova config for inválida, a antiga continua valendo.","x":"","s":""},{"id":"curated:fund-008","d":"fundamentals","o":"curated","k":"curated","f":"Como validar configuração e regras antes de aplicar?","b":"<code>promtool check config prometheus.yml<\/code> (valida também os rule_files referenciados) e <code>promtool check rules rules.yml<\/code>.","x":"","s":"<a href=\"../labs/recording-rules-testing/\">labs/recording-rules-testing<\/a>"},{"id":"curated:fund-009","d":"fundamentals","o":"curated","k":"curated","f":"<code>relabel_configs<\/code> vs <code>metric_relabel_configs<\/code>?","b":"<ul><li><code>relabel_configs<\/code>: <b>antes<\/b> do scrape, sobre o <b>target<\/b> (<code>__meta_*<\/code>, <code>__address__<\/code>). Decide o quê/como raspar.<\/li><li><code>metric_relabel_configs<\/code>: <b>depois<\/b> do scrape, sobre cada <b>amostra<\/b>, antes de gravar. Serve para descartar métricas/labels caros.<\/li><\/ul>","x":"","s":"<a href=\"../labs/service-discovery-relabeling/\">labs/service-discovery-relabeling<\/a>"},{"id":"curated:fund-010","d":"fundamentals","o":"curated","k":"curated","f":"Quais são as <code>action<\/code>s de relabeling?","b":"<code>replace<\/code> (padrão), <code>keep<\/code>, <code>drop<\/code>, <code>keepequal<\/code>, <code>dropequal<\/code>, <code>hashmod<\/code>, <code>labelmap<\/code>, <code>labeldrop<\/code>, <code>labelkeep<\/code>, <code>lowercase<\/code>, <code>uppercase<\/code>.","x":"","s":"<a href=\"../labs/service-discovery-relabeling/\">labs/service-discovery-relabeling<\/a>"},{"id":"curated:fund-011","d":"fundamentals","o":"curated","k":"curated","f":"Defaults de uma regra de relabel: regex <span class=\"cloze\">[…]<\/span>, separator <span class=\"cloze\">[…]<\/span>, replacement <span class=\"cloze\">[…]<\/span>, action <span class=\"cloze\">[…]<\/span>.","b":"Defaults de uma regra de relabel: regex <span class=\"cloze-a\"><code>(.*)<\/code><\/span>, separator <span class=\"cloze-a\"><code>;<\/code><\/span>, replacement <span class=\"cloze-a\"><code>$1<\/code><\/span>, action <span class=\"cloze-a\"><code>replace<\/code><\/span>.","x":"","s":"<a href=\"../labs/service-discovery-relabeling/\">labs/service-discovery-relabeling<\/a>"},{"id":"curated:fund-012","d":"fundamentals","o":"curated","k":"curated","f":"O que acontece com labels que começam com <code>__<\/code> depois do relabeling?","b":"São <b>removidos<\/b> do target (os <code>__meta_*<\/code> só existem durante o relabeling). Para labels temporários, use o prefixo <code>__tmp<\/code>.","x":"","s":"<a href=\"../labs/service-discovery-relabeling/\">labs/service-discovery-relabeling<\/a>"},{"id":"curated:fund-013","d":"fundamentals","o":"curated","k":"curated","f":"Quais labels especiais controlam <b>como<\/b> um target é raspado?","b":"<code>__address__<\/code> (host:porta), <code>__scheme__<\/code> (http/https), <code>__metrics_path__<\/code> (padrão <code>/metrics<\/code>), <code>__param_&lt;nome&gt;<\/code> (query string), <code>__scrape_interval__<\/code>, <code>__scrape_timeout__<\/code>.","x":"","s":"<a href=\"../labs/service-discovery-relabeling/\">labs/service-discovery-relabeling<\/a>"},{"id":"curated:fund-014","d":"fundamentals","o":"curated","k":"curated","f":"O que faz <code>honor_labels: true<\/code>?","b":"Em conflito de labels, <b>mantém os do target<\/b>. Com <code>false<\/code> (padrão), os do target são renomeados para <code>exported_&lt;label&gt;<\/code>. Usado em <b>federation<\/b> e <b>Pushgateway<\/b>.","x":"","s":""},{"id":"curated:fund-015","d":"fundamentals","o":"curated","k":"curated","f":"Cite mecanismos de service discovery.","b":"<code>static_configs<\/code>, <code>file_sd_configs<\/code> (JSON/YAML, recarregado quando muda), <code>kubernetes_sd_configs<\/code>, <code>consul_sd_configs<\/code>, <code>ec2_sd_configs<\/code>, <code>dns_sd_configs<\/code>, <code>http_sd_configs<\/code>...","x":"","s":"<a href=\"../labs/service-discovery-relabeling/\">labs/service-discovery-relabeling<\/a>"},{"id":"curated:fund-016","d":"fundamentals","o":"curated","k":"curated","f":"Quais são os <code>role<\/code>s do <code>kubernetes_sd_configs<\/code>?","b":"<code>node<\/code>, <code>pod<\/code>, <code>service<\/code>, <code>endpoints<\/code>, <code>endpointslice<\/code>, <code>ingress<\/code>.","x":"","s":"<a href=\"../labs/service-discovery-relabeling/\">labs/service-discovery-relabeling<\/a>"},{"id":"curated:fund-017","d":"fundamentals","o":"curated","k":"curated","f":"Como raspar só os pods com a annotation <code>prometheus.io/scrape: \"true\"<\/code>?","b":"<pre><code>relabel_configs:\n  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]\n    regex: \"true\"\n    action: keep<\/code><\/pre>","x":"","s":"<a href=\"../labs/service-discovery-relabeling/\">labs/service-discovery-relabeling<\/a>"},{"id":"curated:fund-018","d":"fundamentals","o":"curated","k":"curated","f":"Retenção padrão da TSDB: <span class=\"cloze\">[…]<\/span>. Flags: <code>--storage.tsdb.retention.<span class=\"cloze\">[…]<\/span><\/code> e <code>--storage.tsdb.retention.<span class=\"cloze\">[…]<\/span><\/code> (vale o que estourar primeiro).","b":"Retenção padrão da TSDB: <span class=\"cloze-a\">15d<\/span>. Flags: <code>--storage.tsdb.retention.<span class=\"cloze-a\">time<\/span><\/code> e <code>--storage.tsdb.retention.<span class=\"cloze-a\">size<\/span><\/code> (vale o que estourar primeiro).","x":"","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"curated:fund-019","d":"fundamentals","o":"curated","k":"curated","f":"Como a TSDB organiza os dados?","b":"<ul><li><b>Head block<\/b> em memória (amostras recentes), protegido pelo <b>WAL<\/b> em disco<\/li><li>A cada ~<b>2 h<\/b> vira um <b>bloco<\/b> imutável em disco (<code>chunks/<\/code>, <code>index<\/code>, <code>meta.json<\/code>, <code>tombstones<\/code>)<\/li><li><b>Compaction<\/b> junta blocos em blocos maiores<\/li><\/ul>","x":"","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"curated:fund-020","d":"fundamentals","o":"curated","k":"curated","f":"Para que serve o WAL (write-ahead log)?","b":"Durabilidade do head block: após um crash/restart, o Prometheus <b>reproduz o WAL<\/b> para reconstruir os dados em memória.","x":"","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"curated:fund-021","d":"fundamentals","o":"curated","k":"curated","f":"Como apagar séries da TSDB?","b":"Admin API (precisa <code>--web.enable-admin-api<\/code>): <code>POST /api/v1/admin/tsdb/delete_series?match[]=...<\/code> grava <b>tombstones<\/b>; <code>clean_tombstones<\/code> remove do disco. Snapshots: <code>POST /api/v1/admin/tsdb/snapshot<\/code>.","x":"","s":"<a href=\"../labs/tsdb-storage/\">labs/tsdb-storage<\/a>"},{"id":"curated:fund-022","d":"fundamentals","o":"curated","k":"curated","f":"O que define a <b>identidade<\/b> de uma série temporal?","b":"Nome da métrica + conjunto de labels (o nome é o label <code>__name__<\/code>). Qualquer valor de label diferente cria uma <b>série nova<\/b>.","x":"","s":""},{"id":"curated:fund-023","d":"fundamentals","o":"curated","k":"curated","f":"Regras de nomes de métricas e labels (formato clássico)?","b":"<ul><li>Métrica: <code>[a-zA-Z_:][a-zA-Z0-9_:]*<\/code> (<code>:<\/code> reservado para recording rules)<\/li><li>Label: <code>[a-zA-Z_][a-zA-Z0-9_]*<\/code>; prefixo <code>__<\/code> reservado ao uso interno<\/li><li>O Prometheus 3 também aceita UTF-8 (entre aspas: <code>{\"my.metric\"}<\/code>)<\/li><\/ul>","x":"","s":""},{"id":"curated:fund-024","d":"fundamentals","o":"curated","k":"curated","f":"O que é um <b>staleness marker<\/b>?","b":"Quando uma série some de um scrape (ou o target some), o Prometheus grava um marcador especial. A série deixa de aparecer em instant queries <b>imediatamente<\/b>, sem esperar o lookback de 5 min.","x":"","s":"<a href=\"../promql-functions-lab/functions/absent/\">promql-functions-lab/functions/absent<\/a>"},{"id":"curated:fund-025","d":"fundamentals","o":"curated","k":"curated","f":"Como funciona a <b>federation<\/b>?","b":"Um Prometheus raspa <code>/federate?match[]=&lt;seletor&gt;<\/code> de outro, com <code>honor_labels: true<\/code>. Use para <b>hierarquia<\/b> (global puxando agregados/recording rules), não para copiar tudo.","x":"","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"curated:fund-026","d":"fundamentals","o":"curated","k":"curated","f":"Para que servem <code>remote_write<\/code> e <code>remote_read<\/code>?","b":"<code>remote_write<\/code> envia amostras em tempo real para um storage remoto (Thanos, Cortex, Mimir, VictoriaMetrics...) para retenção longa e visão global. <code>remote_read<\/code> consulta esses dados de volta.","x":"","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"curated:fund-027","d":"fundamentals","o":"curated","k":"curated","f":"O que é o <b>Agent mode<\/b>?","b":"<code>prometheus --agent<\/code>: só faz scrape + <code>remote_write<\/code> (com WAL). Não tem TSDB consultável, nem regras ou alertas locais. Ideal para edge/clusters que enviam para um storage central.","x":"","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"curated:fund-028","d":"fundamentals","o":"curated","k":"curated","f":"Quais são as limitações conhecidas do Prometheus?","b":"<ul><li>Não serve para <b>logs/eventos<\/b> individuais<\/li><li>Não é 100% preciso (billing): amostragem + extrapolação<\/li><li>Single-node: escala com sharding/federation/Thanos/Mimir<\/li><li>Alta <b>cardinalidade<\/b> consome muita memória<\/li><\/ul>","x":"","s":""},{"id":"curated:fund-029","d":"fundamentals","o":"curated","k":"curated","f":"Para que servem <code>global.external_labels<\/code>?","b":"São labels anexados quando os dados <b>saem<\/b> do Prometheus (federation, remote_write, alertas enviados ao Alertmanager), para identificar a origem (ex.: <code>cluster<\/code>, <code>replica<\/code>).","x":"","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"curated:fund-030","d":"fundamentals","o":"curated","k":"curated","f":"Endpoints de saúde do Prometheus?","b":"<code>/-/healthy<\/code> (processo vivo) e <code>/-/ready<\/code> (pronto para servir consultas). Os targets aparecem na UI <code>/targets<\/code> e na API <code>/api/v1/targets<\/code>.","x":"","s":""},{"id":"curated:fund-031","d":"fundamentals","o":"curated","k":"curated","f":"Portas padrão: Prometheus <span class=\"cloze\">[…]<\/span>, Pushgateway <span class=\"cloze\">[…]<\/span>, Alertmanager <span class=\"cloze\">[…]<\/span> (cluster 9094), node_exporter <span class=\"cloze\">[…]<\/span>, blackbox_exporter <span class=\"cloze\">[…]<\/span>.","b":"Portas padrão: Prometheus <span class=\"cloze-a\">9090<\/span>, Pushgateway <span class=\"cloze-a\">9091<\/span>, Alertmanager <span class=\"cloze-a\">9093<\/span> (cluster 9094), node_exporter <span class=\"cloze-a\">9100<\/span>, blackbox_exporter <span class=\"cloze-a\">9115<\/span>.","x":"","s":""},{"id":"lab:federation-remote-write:cola:1","d":"fundamentals","o":"lab","k":"cola","f":"lab federation-remote-write · <span class=\"cloze\">[…]<\/span> = pull de <code>/federate?match[]=...<\/code>, <code>honor_labels: true<\/code>, só agregados (<code>job:*<\/code>), intervalo maior. Não é backup nem long-term.","b":"lab federation-remote-write · <span class=\"cloze-a\">Federation<\/span> = pull de <code>/federate?match[]=...<\/code>, <code>honor_labels: true<\/code>, só agregados (<code>job:*<\/code>), intervalo maior. Não é backup nem long-term.","x":"","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:cola:2","d":"fundamentals","o":"lab","k":"cola","f":"lab federation-remote-write · <span class=\"cloze\">[…]<\/span> = push a partir do WAL, <code>queue_config<\/code> (shards, capacity, max_samples_per_send, batch_send_deadline), <code>write_relabel_configs<\/code> para filtrar só o envio.","b":"lab federation-remote-write · <span class=\"cloze-a\">Remote write<\/span> = push a partir do WAL, <code>queue_config<\/code> (shards, capacity, max_samples_per_send, batch_send_deadline), <code>write_relabel_configs<\/code> para filtrar só o envio.","x":"","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:cola:3","d":"fundamentals","o":"lab","k":"cola","f":"lab federation-remote-write · Receptor: <code>--web.enable-remote-write-receiver<\/code> → ?","b":"<code>POST /api/v1/write<\/code>.","x":"Cola completa: Receptor: <code>--web.enable-remote-write-receiver<\/code> → <code>POST /api/v1/write<\/code>.","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:cola:4","d":"fundamentals","o":"lab","k":"cola","f":"lab federation-remote-write · <span class=\"cloze\">[…]<\/span> = PromQL local sobre dados crus do remoto; <code>read_recent<\/code>, <code>required_matchers<\/code>, <code>filter_external_labels<\/code>.","b":"lab federation-remote-write · <span class=\"cloze-a\">Remote read<\/span> = PromQL local sobre dados crus do remoto; <code>read_recent<\/code>, <code>required_matchers<\/code>, <code>filter_external_labels<\/code>.","x":"","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:cola:5","d":"fundamentals","o":"lab","k":"cola","f":"lab federation-remote-write · <span class=\"cloze\">[…]<\/span> = <code>--agent<\/code>: scrape + remote write + WAL. Sem queries/regras/alertas. <code>promtool check config --agent<\/code>.","b":"lab federation-remote-write · <span class=\"cloze-a\">Agent<\/span> = <code>--agent<\/code>: scrape + remote write + WAL. Sem queries/regras/alertas. <code>promtool check config --agent<\/code>.","x":"","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:cola:6","d":"fundamentals","o":"lab","k":"cola","f":"lab federation-remote-write · <span class=\"cloze\">[…]<\/span> = carimbo de origem em tudo que sai (<code>cluster<\/code>, <code>replica<\/code>). Obrigatório com federation/remote write/HA.","b":"lab federation-remote-write · <span class=\"cloze-a\"><code>external_labels<\/code><\/span> = carimbo de origem em tudo que sai (<code>cluster<\/code>, <code>replica<\/code>). Obrigatório com federation/remote write/HA.","x":"","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:cola:7","d":"fundamentals","o":"lab","k":"cola","f":"lab federation-remote-write · <span class=\"cloze\">[…]<\/span> = 2 réplicas idênticas + dedup (Thanos <code>--query.replica-label<\/code>, Mimir HA tracker <code>cluster<\/code>+<code>__replica__<\/code>); alertas deduplicados pelo Alertmanager (remova <code>replica<\/code> com <code>alert_relabel_configs<\/code>).","b":"lab federation-remote-write · <span class=\"cloze-a\">HA<\/span> = 2 réplicas idênticas + dedup (Thanos <code>--query.replica-label<\/code>, Mimir HA tracker <code>cluster<\/code>+<code>__replica__<\/code>); alertas deduplicados pelo Alertmanager (remova <code>replica<\/code> com <code>alert_relabel_configs<\/code>).","x":"","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:cola:8","d":"fundamentals","o":"lab","k":"cola","f":"lab federation-remote-write · Long-term: ?","b":"Thanos, Mimir/Cortex, VictoriaMetrics, serviços gerenciados.","x":"Cola completa: Long-term: Thanos, Mimir/Cortex, VictoriaMetrics, serviços gerenciados.","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:cola:9","d":"fundamentals","o":"lab","k":"cola","f":"lab federation-remote-write · Métricas: ?","b":"<code>prometheus_remote_storage_samples_{total,failed_total,dropped_total,pending}<\/code>, <code>..._shards<\/code>, <code>..._queue_highest_(sent_)timestamp_seconds<\/code>.","x":"Cola completa: Métricas: <code>prometheus_remote_storage_samples_{total,failed_total,dropped_total,pending}<\/code>, <code>..._shards<\/code>, <code>..._queue_highest_(sent_)timestamp_seconds<\/code>.","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:pegadinha:1","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab federation-remote-write: pegadinha «<code>match[]<\/code> é obrigatório». O que acontece / por quê?","b":"no <code>/federate<\/code>, e a regex é ancorada (<code>job:<\/code> não casa com <code>job:x<\/code>).","x":"Cola completa: <b><code>match[]<\/code> é obrigatório<\/b> no <code>/federate<\/code>, e a regex é ancorada (<code>job:<\/code> não casa com <code>job:x<\/code>).","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:pegadinha:2","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab federation-remote-write: pegadinha «Federation sem <code>honor_labels: true<\/code>». O que acontece / por quê?","b":"troca <code>job<\/code>/<code>instance<\/code> da origem por <code>exported_job<\/code>/<code>exported_instance<\/code>.","x":"Cola completa: <b>Federation sem <code>honor_labels: true<\/code><\/b> troca <code>job<\/code>/<code>instance<\/code> da origem por <code>exported_job<\/code>/<code>exported_instance<\/code>.","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:pegadinha:3","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab federation-remote-write: pegadinha «Federar tudo». O que acontece / por quê?","b":"<b>Federar tudo<\/b> (<code>{__name__=~\".+\"}<\/code>) é anti-padrão: scrape gigante, timeouts, e o global vira ponto único de falha com toda a cardinalidade.","x":"","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:pegadinha:4","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab federation-remote-write: pegadinha «<code>external_labels<\/code> não aparecem em queries locais». O que acontece / por quê?","b":"<b><code>external_labels<\/code> não aparecem em queries locais<\/b>, só no que sai. Colocar o mesmo <code>cluster<\/code> em dois Prometheus = colisão silenciosa ou rejeição (<code>duplicate sample<\/code>).","x":"","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:pegadinha:5","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab federation-remote-write: pegadinha «<code>write_relabel_configs<\/code> afeta só o remote write». O que acontece / por quê?","b":"<b><code>write_relabel_configs<\/code> afeta só o remote write<\/b>; <code>metric_relabel_configs<\/code> afeta o local <b>e<\/b> o remoto.","x":"","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:pegadinha:6","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab federation-remote-write: pegadinha «Remote write lê o WAL». O que acontece / por quê?","b":"se o destino ficar fora mais que a janela do WAL (~2h), dados se perdem. Monitore <code>..._samples_failed_total<\/code>, <code>..._samples_pending<\/code> e o atraso <code>highest_timestamp - highest_sent_timestamp<\/code>.","x":"Cola completa: <b>Remote write lê o WAL:<\/b> se o destino ficar fora mais que a janela do WAL (~2h), dados se perdem. Monitore <code>..._samples_failed_total<\/code>, <code>..._samples_pending<\/code> e o atraso <code>highest_timestamp - highest_sent_timestamp<\/code>.","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:pegadinha:7","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab federation-remote-write: pegadinha «O receptor precisa de <code>--web.enable-remote-write-receiver<\/code>». O que acontece / por quê?","b":"<b>O receptor precisa de <code>--web.enable-remote-write-receiver<\/code><\/b>, senão <code>404<\/code> em <code>/api/v1/write<\/code>.","x":"","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:pegadinha:8","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab federation-remote-write: pegadinha «Agent não consulta, não avalia regras, não alerta». O que acontece / por quê?","b":"<code>rule_files<\/code>/<code>alerting<\/code>/<code>remote_read<\/code> na config = erro.","x":"Cola completa: <b>Agent não consulta, não avalia regras, não alerta.<\/b> <code>rule_files<\/code>/<code>alerting<\/code>/<code>remote_read<\/code> na config = erro.","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:pegadinha:9","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab federation-remote-write: pegadinha «Remote read acrescenta os <code>external_labels<\/code> do leitor». O que acontece / por quê?","b":"como filtro (<code>filter_external_labels: true<\/code> padrão) e é processado localmente (puxa dados crus).","x":"Cola completa: <b>Remote read acrescenta os <code>external_labels<\/code> do leitor<\/b> como filtro (<code>filter_external_labels: true<\/code> padrão) e é processado localmente (puxa dados crus).","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:federation-remote-write:pegadinha:10","d":"fundamentals","o":"lab","k":"pegadinha","f":"⚠️ lab federation-remote-write: pegadinha «HA sem dedup». O que acontece / por quê?","b":"= <code>sum()<\/code> em dobro. O label de réplica deve ser o <b>único<\/b> diferente entre as réplicas.","x":"Cola completa: <b>HA sem dedup<\/b> = <code>sum()<\/code> em dobro. O label de réplica deve ser o <b>único<\/b> diferente entre as réplicas.","s":"<a href=\"../labs/federation-remote-write/\">labs/federation-remote-write<\/a>"},{"id":"lab:service-discovery-relabeling:cola:1","d":"fundamentals","o":"lab","k":"cola","f":"l
