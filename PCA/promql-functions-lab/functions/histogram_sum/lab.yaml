function: histogram_sum
title: "histogram_sum() — a soma dos valores observados"
category: "04 - Histogramas"
time_from: now-15m
intro: |
  **Analogia:** o histograma é a **balança do caixa do supermercado**: cada produto é pesado. `histogram_sum` é o **peso total** de
  tudo que passou. Com `rate()`, vira **"quantidade por segundo"**: bytes/s, ou "segundos de trabalho por segundo" (= concorrência).
  **Só funciona com native histograms** (o equivalente classic é `x_sum`).

  Métricas: `histogram_sum_http_response_size_bytes{route}` (`/api/items` ≈100 KB/s, `/download` ≈5 MB/s) e
  `histogram_sum_job_duration_seconds{queue}` (`emails` ≈2 workers ocupados, `reports` ≈4, e ≈8 por 90s a cada 5 min).
  Legenda dos painéis: 🟢 básico · 🟡 nuance/pegadinha · 🔴 caso real de produção.
panels:
  - title: "🟢 1. Throughput: histogram_sum(rate(size[1m])) = bytes/s"
    description: "/api/items ≈ 100 kB/s (50 resp/s × 2 KB). /download ≈ 5 MB/s (1 resp/s × 5 MB)."
    unit: Bps
    queries:
      - expr: histogram_sum(rate(histogram_sum_http_response_size_bytes[1m]))
        legend: "{{route}}"
  - title: "🟡 2. Native vs classic: histogram_sum(rate(x)) = rate(x_sum)"
    description: "Linhas sobrepostas: o _sum do classic é o sum do native."
    unit: Bps
    queries:
      - expr: histogram_sum(rate(histogram_sum_http_response_size_bytes{route="/download"}[1m]))
        legend: "native: histogram_sum(rate(x))"
      - expr: rate(histogram_sum_http_response_size_bytes_sum{route="/download"}[1m])
        legend: "classic: rate(x_sum)"
  - title: "🟡 3. Bytes enviados em 5 min: histogram_sum(increase(x[5m]))"
    description: "/download ≈ 1.5 GB (5 MB × 300). /api/items ≈ 30 MB."
    unit: decbytes
    queries:
      - expr: histogram_sum(increase(histogram_sum_http_response_size_bytes[5m]))
        legend: "{{route}}"
  - title: "🔴 4. Duração: histogram_sum(rate(x)) = workers ocupados (Lei de Little)"
    description: "emails: 10 jobs/s × 0.2s = 2. reports: 0.5 job/s × 8s = 4, e ≈8 quando os relatórios ficam 2× mais lentos."
    unit: short
    queries:
      - expr: histogram_sum(rate(histogram_sum_job_duration_seconds[1m]))
        legend: "{{queue}} (s de trabalho / s)"
  - title: "🟡 5. ...enquanto o NÚMERO de jobs não muda"
    description: "histogram_count(rate(...)): emails ≈10/s, reports ≈0.5/s o tempo todo. Quem mudou foi a soma das durações."
    unit: short
    queries:
      - expr: histogram_count(rate(histogram_sum_job_duration_seconds[1m]))
        legend: "{{queue}} jobs/s"
  - title: "🔴 6. Total de workers ocupados e ❌ em classic = vazio"
    description: "histogram_sum(sum(rate(x))) ≈ 6 (≈10 no período lento). histogram_sum sobre x_sum (float) → vazio."
    unit: short
    queries:
      - expr: histogram_sum(sum(rate(histogram_sum_job_duration_seconds[1m])))
        legend: "total workers ocupados"
      - expr: histogram_sum(rate(histogram_sum_job_duration_seconds_sum[1m]))
        legend: "vazio (x_sum é float)"
        validate: empty
