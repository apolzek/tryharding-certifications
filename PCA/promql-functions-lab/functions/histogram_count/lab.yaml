function: histogram_count
title: "histogram_count() — quantas observações tem o native histogram"
category: "04 - Histogramas"
time_from: now-15m
intro: |
  **Analogia:** o histograma é uma **urna de votos** separada por faixas. `histogram_count` ignora EM QUEM votaram e só **conta os votos**.
  Com `rate()`, vira **observações por segundo** (= req/s). **Só funciona com native histograms** (o equivalente classic é `x_count`).

  Métrica: `histogram_count_http_request_duration_seconds{route}`. `/home`: tráfego em onda 20 ± 10 req/s (período 5 min).
  `/login`: ~5 req/s com **rajada de 60s a ~25 req/s a cada 4 min** (e requisições lentas, ~600ms, durante a rajada).
  Legenda dos painéis: 🟢 básico · 🟡 nuance/pegadinha · 🔴 caso real de produção.
panels:
  - title: "🟢 1. histogram_count(x) cru — sempre sobe (é um counter)"
    description: "Número acumulado de observações desde que o processo subiu. Igual a olhar um counter cru: pouco útil sozinho."
    queries:
      - expr: histogram_count(histogram_count_http_request_duration_seconds)
        legend: "{{route}}"
  - title: "🟢 2. histogram_count(rate(x[1m])) — req/s por rota"
    description: "/home ondula entre ≈10 e ≈30 req/s. /login fica em ≈5 e sobe para ≈25 durante a rajada."
    unit: reqps
    queries:
      - expr: histogram_count(rate(histogram_count_http_request_duration_seconds[1m]))
        legend: "{{route}}"
  - title: "🟡 3. Native vs classic: histogram_count(rate(x)) = rate(x_count)"
    description: "As duas linhas se sobrepõem. histogram_count do native é o _count do classic."
    unit: reqps
    queries:
      - expr: histogram_count(rate(histogram_count_http_request_duration_seconds{route="/login"}[1m]))
        legend: "native: histogram_count(rate(x))"
      - expr: rate(histogram_count_http_request_duration_seconds_count{route="/login"}[1m])
        legend: "classic: rate(x_count)"
  - title: "🔴 4. Total de requisições em 5 min: histogram_count(increase(x[5m]))"
    description: "/home ≈ 6000 (20 req/s × 300s). /login entre ≈2700 e ≈3900, dependendo de quantas rajadas caem na janela."
    unit: short
    queries:
      - expr: histogram_count(increase(histogram_count_http_request_duration_seconds[5m]))
        legend: "{{route}}"
  - title: "🔴 5. Req/s LENTAS (> 500ms) em /login"
    description: "count × fraction: ≈0 fora da rajada; ≈18 req/s lentas durante a rajada. Classic: rate(_count) − rate(_bucket{le=\"0.5\"})."
    unit: reqps
    queries:
      - expr: histogram_count(rate(histogram_count_http_request_duration_seconds{route="/login"}[1m])) * histogram_fraction(0.5, +Inf, rate(histogram_count_http_request_duration_seconds{route="/login"}[1m]))
        legend: "native: count × fraction(0.5, +Inf)"
      - expr: rate(histogram_count_http_request_duration_seconds_count{route="/login"}[1m]) - ignoring(le) rate(histogram_count_http_request_duration_seconds_bucket{route="/login", le="0.5"}[1m])
        legend: "classic: _count − _bucket{le=0.5}"
  - title: "🔴 6. Total do serviço e ❌ em classic = vazio"
    description: "histogram_count(sum(rate(x))) soma as rotas: 25 a 55 req/s. Já histogram_count sobre x_count (float) → vazio."
    unit: reqps
    queries:
      - expr: histogram_count(sum(rate(histogram_count_http_request_duration_seconds[1m])))
        legend: "total (native)"
      - expr: histogram_count(rate(histogram_count_http_request_duration_seconds_count[1m]))
        legend: "vazio (x_count é float)"
        validate: empty
