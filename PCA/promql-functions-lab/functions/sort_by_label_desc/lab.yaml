function: sort_by_label_desc
title: "sort_by_label_desc() — ordenar pelo NOME (label), decrescente"
category: "09 - Labels e ordenação"
time_from: now-15m
intro_height: 6
intro: |
  **Analogia:** é a **caixa de entrada do e-mail ordenada por data, mais recente primeiro**, ou a lista de releases no GitHub (a mais nova em cima).
  `sort_by_label_desc(v, "label", ...)` = `sort_by_label` ao contrário, também em **ordem natural** (11 > 10 > 9). **Experimental**.

  ⚠️ Só afeta **consultas instantâneas**. Ordem natural **não é semver**: `2.11.0-rc.1` fica ACIMA de `2.11.0`.
  Métricas: `sort_by_label_desc_backup_last_size_bytes{date}`, `sort_by_label_desc_app_build_info{pod,version}`, `sort_by_label_desc_kafka_log_size_bytes{topic,partition}`.
panels:
  - title: "🔴 1. Backups: o de HOJE primeiro"
    type: table
    height: 7
    unit: bytes
    description: "Datas YYYY-MM-DD ordenam corretamente como texto/natural. Hoje = 14 GiB, ontem 13 GiB... há 4 dias 10 GiB."
    overrides: &hide
      - matcher: {id: byRegexp, options: "^(Time|job|instance|env|__name__)$"}
        properties: [{id: custom.hidden, value: true}]
    queries:
      - expr: sort_by_label_desc(sort_by_label_desc_backup_last_size_bytes, "date")
  - title: "🟡 2. Versões, mais nova primeiro — e a pegadinha do semver"
    type: table
    height: 7
    description: "Natural desc: 2.11.0-rc.1 (1 pod), 2.11.0 (3), 2.10.3 (4), 2.9.1 (1). Semver colocaria 2.11.0 acima do rc!"
    overrides: *hide
    queries:
      - expr: sort_by_label_desc(count by (version) (sort_by_label_desc_app_build_info), "version")
  - title: "🟢 3. Partições Kafka: 11, 10, 9 ... 0 (natural)"
    type: table
    height: 14
    unit: bytes
    description: "Ordem natural decrescente dos números da partição. Alfabética decrescente daria 9, 8, ..., 2, 11, 10, 1, 0."
    overrides:
      - matcher: {id: byRegexp, options: "^(Time|job|instance|env|__name__)$"}
        properties: [{id: custom.hidden, value: true}]
      - matcher: {id: byName, options: partition}
        properties: [{id: unit, value: none}, {id: decimals, value: 0}]
    queries:
      - expr: sort_by_label_desc(sort_by_label_desc_kafka_log_size_bytes, "partition")
  - title: "🟢 4. Bar gauge: partições em ordem decrescente de número"
    type: bargauge
    height: 14
    unit: bytes
    description: "Tamanho = (partição + 1) GiB, então as barras decrescem em escada: 12 GiB, 11 GiB, ..., 1 GiB."
    queries:
      - expr: sort_by_label_desc(sort_by_label_desc_kafka_log_size_bytes, "partition")
        legend: "partition {{partition}}"
  - title: "🟡 5. Lado a lado: sort_by_label (crescente) nas mesmas versões"
    type: table
    height: 7
    description: "A 'vizinha' crescente: 2.9.1, 2.10.3, 2.11.0, 2.11.0-rc.1. Compare com o painel 2: é exatamente a ordem inversa (o rc continua 'depois' do final)."
    overrides:
      - matcher: {id: byRegexp, options: "^(Time|job|instance|env|__name__)$"}
        properties: [{id: custom.hidden, value: true}]
    queries:
      - expr: sort_by_label(count by (version) (sort_by_label_desc_app_build_info), "version")
