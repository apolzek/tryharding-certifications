function: exp
title: "exp() — e elevado a x: crescimento composto e 'desfazer' o logaritmo"
category: "01 - Matemática"
time_from: now-15m
intro_height: 5
intro: |
  **Analogia:** `exp(x) = eˣ` (e ≈ 2.718) é **juros compostos contínuos**: se algo cresce a uma taxa `r` por segundo, depois de `t` segundos
  ele foi multiplicado por `exp(r·t)`. E é o **inverso do `ln()`**: `exp(ln(42)) = 42`.

  Métricas: `exp_prometheus_tsdb_head_series` (explosão de cardinalidade: ×16 em 10 min, dobra a cada 2.5 min) e `exp_fraud_model_score_logit` (log-odds de -5 a +5).
panels:
  - title: "🟢 1. Séries no head do Prometheus (cru): explosão de cardinalidade"
    description: "Cresce de 10k para 160k em 10 min (dobra a cada 2.5 min) e cai quando o label ruim é removido. Curva que 'empina'."
    queries:
      - expr: exp_prometheus_tsdb_head_series
        legend: "head series"
  - title: "🟡 2. Fator de crescimento em 2 min = exp(r · 120)"
    description: "r = deriv(ln(x)[1m:]) ≈ 0.00462/s. exp(0.00462·120) = exp(0.5545) ≈ 1.74 → em 2 min haverá 74% mais séries."
    decimals: 3
    queries:
      - expr: exp(deriv(ln(exp_prometheus_tsdb_head_series)[1m:5s]) * 120)
        legend: "fator exp(r·120)"
  - title: "🔴 3. Previsão feita 2 min atrás × valor real agora"
    description: "Projeção exponencial (exp) gruda no real. predict_linear (reta) fica ABAIXO: subestima crescimento composto. (Previsões escondidas nos 3 min após cada limpeza, quando a janela pega a queda.)"
    queries:
      - expr: exp_prometheus_tsdb_head_series
        legend: "real (agora)"
      - expr: (exp_prometheus_tsdb_head_series offset 2m * exp(deriv(ln(exp_prometheus_tsdb_head_series)[1m:5s] offset 2m) * 120)) and (exp_prometheus_tsdb_head_series > exp_prometheus_tsdb_head_series offset 3m)
        legend: "previsto há 2 min com exp()"
      - expr: predict_linear(exp_prometheus_tsdb_head_series[1m] offset 2m, 0) and (exp_prometheus_tsdb_head_series > exp_prometheus_tsdb_head_series offset 3m)
        legend: "previsto há 2 min com predict_linear"
  - title: "🟢 4. Score do modelo em log-odds (cru): -5 a +5"
    description: "Log-odds é ótimo para o modelo, mas ninguém entende '2.3' no dashboard."
    queries:
      - expr: exp_fraud_model_score_logit
        legend: "logit {{model}}"
  - title: "🔴 5. Probabilidade de fraude = 1 / (1 + exp(-logit))"
    description: "A sigmoide leva -5..+5 para 0.7%..99.3%. logit 0 → 50%. Achata perto de 0% e 100%."
    unit: percentunit
    min: 0
    max: 1
    queries:
      - expr: 1 / (1 + exp(-exp_fraud_model_score_logit))
        legend: "P(fraude) {{model}}"
  - title: "⚠️ 6. Casos especiais (instantâneo, com vector())"
    type: stat
    width: 12
    queries:
      - expr: exp(vector(0))
        legend: "exp(0)"
      - expr: exp(vector(1))
        legend: "exp(1) = e"
      - expr: exp(ln(vector(42)))
        legend: "exp(ln(42))"
      - expr: exp(vector(-Inf))
        legend: "exp(-Inf)"
      - expr: exp(vector(+Inf))
        legend: "exp(+Inf)"
      - expr: exp(vector(710))
        legend: "exp(710) overflow"
      - expr: exp(vector(NaN))
        legend: "exp(NaN)"
