function: log2
title: "log2() — logaritmo base 2: quantas DOBRAS? qual a próxima potência de 2?"
category: "01 - Matemática"
time_from: now-15m
intro_height: 5
intro: |
  **Analogia:** `log2(x)` responde "**quantas vezes eu dobro 1 até chegar em x?**". `log2(8) = 3` (1→2→4→8), `log2(1024) = 10`, `log2(0.5) = -1`.
  Combinado com `ceil`, dá a **próxima potência de 2**: `2 ^ ceil(log2(700 MiB))` = 1024 MiB. É também a base dos buckets de **native histograms** (schema 0).

  Métricas: `log2_kube_deployment_status_replicas` (HPA: 2→4→8→16→32) e `log2_container_memory_working_set_bytes{pod}` (~300 MiB a ~3.1 GiB).
panels:
  - title: "🟢 1. Réplicas do checkout (cru): 2 → 4 → 8 → 16 → 32"
    description: "A cada minuto o HPA dobra as réplicas. Na escala linear, os degraus ficam cada vez maiores."
    queries:
      - expr: log2_kube_deployment_status_replicas
        legend: "réplicas {{deployment}}"
  - title: "🟢 2. log2(réplicas) e dobras desde o normal: log2(x / 2)"
    description: "log2 vira escada de degraus IGUAIS (1,2,3,4,5). log2(x/2) = quantas vezes dobrou a partir de 2 réplicas (0..4)."
    queries:
      - expr: log2(log2_kube_deployment_status_replicas)
        legend: "log2(réplicas)"
      - expr: log2(log2_kube_deployment_status_replicas / 2)
        legend: "dobras desde 2 réplicas"
  - title: "🟡 3. Memória por pod (cru)"
    description: "~300 MiB, ~700 MiB, ~1.5 GiB e ~3.1 GiB."
    unit: bytes
    queries:
      - expr: log2_container_memory_working_set_bytes
        legend: "{{pod}}"
  - title: "🟡 4. log2(bytes): 'quantos bits' de endereço — 28.2, 29.5, 30.6, 31.6"
    description: "Cada +1 é o dobro. 2^30 = 1 GiB: quem passa de 30 já passou de 1 GiB."
    decimals: 2
    queries:
      - expr: log2(log2_container_memory_working_set_bytes)
        legend: "{{pod}}"
  - title: "🔴 5. Próxima potência de 2 = 2 ^ ceil(log2(x)) → sugestão de limite"
    description: "300 MiB → 512 MiB, 700 MiB → 1 GiB, 1.5 GiB → 2 GiB, 3.1 GiB → 4 GiB."
    type: bargauge
    unit: bytes
    queries:
      - expr: 2 ^ ceil(log2(log2_container_memory_working_set_bytes))
        legend: "{{pod}}"
        instant: true
  - title: "⚠️ 6. Casos especiais (instantâneo, com vector())"
    type: stat
    width: 12
    queries:
      - expr: log2(vector(1024))
        legend: "log2(1024)"
      - expr: log2(vector(3))
        legend: "log2(3)"
      - expr: log2(vector(1))
        legend: "log2(1)"
      - expr: log2(vector(0.5))
        legend: "log2(0.5)"
      - expr: log2(vector(0))
        legend: "log2(0)"
      - expr: log2(vector(-8))
        legend: "log2(-8)"
      - expr: log2(vector(+Inf))
        legend: "log2(+Inf)"
