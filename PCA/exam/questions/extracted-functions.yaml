  - '`time() - timestamp(temp_celsius)`'
  - '`time() - ts_of_last_over_time(temp_celsius[30m])`'
  - '`absent_over_time(temp_celsius[30m])`'
  - '`last_over_time(temp_celsius[30m])`'
  answer: B
  explanation_pt: A) some para sensores parados. C) só diz se **nenhuma** série existe (e perde os labels das que sumiram). D) devolve o **valor**, não o horário.
  source: promql-functions-lab/functions/ts_of_last_over_time/README.md
  lang: pt
- id: fn-ts_of_last_over_time-3
  domain: PromQL
  difficulty: medium
  question: Qual a diferença entre `last_over_time(x[10m])` e `ts_of_last_over_time(x[10m])`?
  options:
  - Nenhuma.
  - O primeiro devolve o **valor** da amostra mais recente; o segundo, o **timestamp** dela.
  - O primeiro é experimental.
  - O segundo junta todas as séries.
  answer: B
  explanation_pt: '`last_over_time` é estável e devolve o valor; `ts_of_last_over_time` é experimental e devolve o timestamp.'
  source: promql-functions-lab/functions/ts_of_last_over_time/README.md
  lang: pt
- id: fn-ts_of_last_over_time-4
  domain: PromQL
  difficulty: medium
  question: 'Um sensor está parado há 45 minutos. `time() - ts_of_last_over_time(temp[30m])` retorna para ele:'
  options:
  - ~2700
  - '1800'
  - 'Nada: não há amostras dele na janela de 30m.'
  - +Inf
  answer: C
  explanation_pt: A função só enxerga a janela. Sem amostras nos últimos 30 min, a série não aparece no resultado.
  source: promql-functions-lab/functions/ts_of_last_over_time/README.md
  lang: pt
- id: fn-ts_of_max_over_time-1
  domain: PromQL
  difficulty: medium
  question: Você quer saber **quando**, na última hora, o uso de memória de cada pod foi máximo. Qual query?
  options:
  - '`timestamp(max_over_time(container_memory_working_set_bytes[1h]))`'
  - '`ts_of_max_over_time(container_memory_working_set_bytes[1h])`'
  - '`max_over_time(timestamp(container_memory_working_set_bytes)[1h])`'
  - '`time() - max_over_time(container_memory_working_set_bytes[1h])`'
  answer: B
  explanation_pt: A) retorna o instante de avaliação. C) é inválido sem subquery e, com subquery, daria o timestamp mais recente, não o do pico. D) mistura bytes com segundos.
  source: promql-functions-lab/functions/ts_of_max_over_time/README.md
  lang: pt
- id: fn-ts_of_max_over_time-2
  domain: PromQL
  difficulty: medium
  question: 'Na janela, a CPU bateu 100% em t=50 e novamente 100% em t=90. `ts_of_max_over_time` retorna:'
  options:
  - '50'
  - '90'
  - '70'
  - as duas amostras
  answer: B
  explanation_pt: Empate → última amostra com o valor máximo. E a função retorna **uma** amostra por série.
  source: promql-functions-lab/functions/ts_of_max_over_time/README.md
  lang: pt
- id: fn-ts_of_max_over_time-3
  domain: PromQL
  difficulty: medium
  question: Por que `ts_of_max_over_time(http_requests_total[1h])` quase sempre retorna um valor próximo de "agora"?
  options:
  - Porque a função ignora counters.
  - Porque um counter só cresce, então o máximo é a amostra mais recente (salvo resets).
  - Porque o resultado é sempre `time()`.
  - Porque counters não têm timestamp.
  answer: B
  explanation_pt: 'Counters são monotônicos: o maior valor é o último. Para "quando foi o pico de **taxa**", aplique `rate` antes (subquery ou recording rule).'
  source: promql-functions-lab/functions/ts_of_max_over_time/README.md
  lang: pt
- id: fn-ts_of_max_over_time-4
  domain: PromQL
  difficulty: medium
  question: O que é necessário para usar `ts_of_max_over_time`?
  options:
  - Prometheus ≥ 2.0 sem flags.
  - '`--enable-feature=promql-experimental-functions`.'
  - Um histogram nativo.
  - Um recording rule.
  answer: B
  explanation_pt: É uma função experimental.
  source: promql-functions-lab/functions/ts_of_max_over_time/README.md
  lang: pt
- id: fn-ts_of_min_over_time-1
  domain: PromQL
  difficulty: medium
  question: Qual expressão retorna "há quantos segundos o espaço livre em disco atingiu o menor valor da última hora"?
  options:
  - '`min_over_time(node_filesystem_avail_bytes[1h]) - time()`'
  - '`time() - ts_of_min_over_time(node_filesystem_avail_bytes[1h])`'
  - '`timestamp(min_over_time(node_filesystem_avail_bytes[1h]))`'
  - '`ts_of_min_over_time(node_filesystem_avail_bytes[1h]) - time()`'
  answer: B
  explanation_pt: '`ts_of_min_over_time` dá o instante do mínimo; `time()` menos ele dá a idade (positiva). D daria negativo. C) `timestamp()` de um resultado de função retorna o instante de **avaliação**, não o do mínimo.'
  source: promql-functions-lab/functions/ts_of_min_over_time/README.md
  lang: pt
- id: fn-ts_of_min_over_time-2
  domain: PromQL
  difficulty: medium
  question: Na janela, o valor mínimo 0 aparece em 3 amostras (t=100, t=105, t=110). O que `ts_of_min_over_time` retorna?
  options:
  - '100'
  - '105'
  - '110'
  - '0'
  answer: C
  explanation_pt: 'A documentação define: timestamp da **última** amostra com o valor mínimo.'
  source: promql-functions-lab/functions/ts_of_min_over_time/README.md
  lang: pt
- id: fn-ts_of_min_over_time-3
  domain: PromQL
  difficulty: medium
  question: Em que unidade vem o resultado de `ts_of_min_over_time`?
  options:
  - milissegundos desde 1970
  - segundos desde 1970
  - segundos desde o início da janela
  - mesma unidade da métrica
  answer: B
  explanation_pt: Timestamps em PromQL são segundos Unix (com fração), como em `time()` e `timestamp()`.
  source: promql-functions-lab/functions/ts_of_min_over_time/README.md
  lang: pt
- id: fn-ts_of_min_over_time-4
