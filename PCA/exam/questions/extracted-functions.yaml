  options:
  - 1 minuto
  - Até o próximo scrape
  - Até 5 minutos (lookback delta padrão)
  - Para sempre
  answer: C
  explanation_pt: O `--query.lookback-delta` padrão é 5m. Se a série **sumiu** do target (staleness marker), porém, o resultado para imediatamente.
  source: promql-functions-lab/functions/last_over_time/README.md
  lang: pt
