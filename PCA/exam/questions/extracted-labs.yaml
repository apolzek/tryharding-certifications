  lang: en
- id: lab-instrumentation-3
  domain: Instrumentation and Exporters
  difficulty: medium
  question: A developer adds a label `request_id` to `http_requests_total`. What is the main problem?
  options:
  - Label names can't contain underscores
  - 'Unbounded cardinality: each request creates a new time series'
  - Counters cannot have labels
  - '`promtool check metrics` will reject it'
  answer: B
  explanation_pt: 'Cada valor único vira uma série: memória e disco explodem. O `promtool check metrics` **não** detecta isso (D é falso). IDs únicos vão para logs/traces.'
  source: labs/instrumentation/README.md
  lang: en
