- id: lab-alertmanager-9
  domain: Alerting and Dashboarding
  difficulty: medium
  question: Which of the following should be an **annotation** rather than a **label** on an alerting rule?
  options:
  - '`severity: critical`'
  - '`team: payments`'
  - '`summary: "{{ $value }} errors"`'
  - '`service: checkout`'
