receivers:
  - name: default
    webhook_configs: [{ url: http://receiver:8080/hook/default, send_resolved: true }]
  - name: pager
    webhook_configs: [{ url: http://receiver:8080/hook/pager, send_resolved: true }]
  - name: slack
    webhook_configs: [{ url: http://receiver:8080/hook/slack, send_resolved: true }]
  - name: dba
    webhook_configs: [{ url: http://receiver:8080/hook/dba, send_resolved: true }]

route:
  receiver: slack
  group_by: [alertname, cluster]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  routes:
    - matchers: [team="batch"]
      receiver: slack
      mute_time_intervals: [manutencao]    # mute = NÃO notifica dentro da janela
                                           # active = SÓ notifica dentro da janela

time_intervals:
  - name: manutencao
    time_intervals:
      - weekdays: ["sunday:saturday"]
      # na vida real, algo como:
      # - weekdays: ["saturday"]
      #   times: [{ start_time: "02:00", end_time: "04:00" }]
      #   location: America/Sao_Paulo
