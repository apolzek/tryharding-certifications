# EXERCÍCIO 08: warnings do team=batch NÃO devem ser notificados durante a
# janela "manutencao". Para o teste ser determinístico, a janela cobre todos os dias.
# Hoje: os warnings do batch chegam no slack mesmo assim.
receivers:
  - name: default
    webhook_configs: [{ url: http://receiver:8080/hook/default, send_resolved: true }]
  - name: pager
    webhook_configs: [{ url: http://receiver:8080/hook/pager, send_resolved: true }]
  - name: slack
    webhook_configs: [{ url: http://receiver:8080/hook/slack, send_resolved: true }]
  - name: dba
    webhook_configs: [{ url: http://receiver:8080/hook/dba, send_resolved: true }]

route:
  receiver: slack
  group_by: [alertname, cluster]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  routes:
    - matchers: [team="batch"]
      receiver: slack
      active_time_intervals: [manutencao]

time_intervals:
  - name: manutencao
    time_intervals:
      - weekdays: ["sunday:saturday"]
