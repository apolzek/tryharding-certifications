global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: payments-api
    static_configs:
      - targets: [payments-api:8000]
    # relabel_configs roda ANTES do scrape (sobre alvos: não existe __name__ ali).
    # Filtrar métricas é trabalho do metric_relabel_configs (DEPOIS do scrape).
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: app_requests_by_user_total
        action: drop
