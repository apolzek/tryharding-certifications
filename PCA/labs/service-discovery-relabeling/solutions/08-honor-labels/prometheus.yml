global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: batch
    metrics_path: /admin/metrics   # o legacy-batch não serve /metrics (404)
    honor_labels: true             # em conflito, o label EXPOSTO pelo alvo vence
    static_configs:
      - targets: [legacy-batch:8000]
