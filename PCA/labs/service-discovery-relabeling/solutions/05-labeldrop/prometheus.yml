global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: apps-labeldrop
    file_sd_configs:
      - files: [/etc/prometheus/sd/apps.json]
    metric_relabel_configs:
      # labeldrop olha o NOME dos labels (regex), não aceita source_labels
      - regex: pod_uid
        action: labeldrop
