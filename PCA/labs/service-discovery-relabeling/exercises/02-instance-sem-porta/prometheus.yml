global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Objetivo: instance="payments-api" (sem ":8000"), um alvo por serviço.
  - job_name: apps-hostname
    file_sd_configs:
      - files: [/etc/prometheus/sd/apps.json]
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*):(.*)'
        target_label: instance
        replacement: '$2'
