global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Objetivo: parar de armazenar app_requests_by_user_total (1 série por usuário!)
  # sem perder as outras métricas do payments-api.
  - job_name: payments-api
    static_configs:
      - targets: [payments-api:8000]
    relabel_configs:
      - source_labels: [__name__]
        regex: app_requests_by_user_total
        action: drop
