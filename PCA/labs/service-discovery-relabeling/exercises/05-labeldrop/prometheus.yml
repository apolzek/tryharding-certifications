global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Objetivo: remover o label pod_uid (muda a cada deploy = churn de séries).
  - job_name: apps-labeldrop
    file_sd_configs:
      - files: [/etc/prometheus/sd/apps.json]
    metric_relabel_configs:
      - source_labels: [pod_uid]
        regex: pod_uid
        action: labeldrop
