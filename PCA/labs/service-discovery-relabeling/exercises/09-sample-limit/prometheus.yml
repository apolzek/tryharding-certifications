global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Objetivo: o time impôs sample_limit: 100 e o payments-api ficou up=0.
  # Conserte SEM aumentar o limite.
  - job_name: payments-limited
    sample_limit: 100
    static_configs:
      - targets: [payments-api:8000]
