rule_files: [rules.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="api", instance="a"}'
        values: '0+60x20'     # 60 por minuto = 1/s
      - series: 'http_requests_total{job="api", instance="b"}'
        values: '0+30x20'     # 30 por minuto = 0.5/s
    promql_expr_test:
      - expr: job:http_requests:rate5m
        eval_time: 10m
        exp_samples:
          # 1) sum by (job) remove o label instance
          # 2) rate é POR SEGUNDO: 1 + 0.5 = 1.5 (e não 90 "por minuto")
          - labels: 'job:http_requests:rate5m{job="api"}'
            value: 1.5
