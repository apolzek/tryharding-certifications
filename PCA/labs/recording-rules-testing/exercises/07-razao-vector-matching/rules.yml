# EXERCÍCIO 07: a razão de erros sai VAZIA. Conserte a REGRA (o teste está certo).
groups:
  - name: ex07
    rules:
      - record: job:http_requests:rate5m
        expr: sum by (job) (rate(http_requests_total[5m]))
      - record: job:http_requests_errors:rate5m
        expr: sum by (job, code) (rate(http_requests_total{code=~"5.."}[5m]))
      - record: job:http_requests_errors:ratio_rate5m
        expr: job:http_requests_errors:rate5m / job:http_requests:rate5m
