rule_files: [rules.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="api", code="200"}'
        values: '0+180x20'   # 3/s
      - series: 'http_requests_total{job="api", code="500"}'
        values: '0+30x20'    # 0.5/s
      - series: 'http_requests_total{job="api", code="503"}'
        values: '0+30x20'    # 0.5/s   -> erros 1/s de 4/s = 0.25
    promql_expr_test:
      - expr: job:http_requests_errors:ratio_rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'job:http_requests_errors:ratio_rate5m{job="api"}'
            value: 0.25
