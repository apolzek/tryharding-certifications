# Alguém copiou a config de um Prometheus "servidor" para o agent (--agent)...
# Objetivo: o agent raspa o app-c e ENVIA tudo para o receiver com cluster="edge".
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: app
    static_configs:
      - targets: [app-c:8000]
  - job_name: agent
    static_configs:
      - targets: [localhost:9090]
