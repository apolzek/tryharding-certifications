# Prometheus global: não raspa apps, só FEDERA os agregados (job:*) dos clusters.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    tier: global

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: federate
    scrape_interval: 10s
    scrape_timeout: 8s
    honor_labels: false
    metrics_path: /federate
    params:
      'match[]':
        - '{__name__=~"job:.*"}'   # só as recording rules agregadas
    static_configs:
      - targets: [prom-a:9090, prom-b:9090]
