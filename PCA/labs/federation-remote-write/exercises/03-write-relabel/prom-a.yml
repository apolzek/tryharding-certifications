# Prometheus "de borda" do cluster a: raspa o app local, gera recording rules
# e envia (remote_write) só os agregados para o receiver central.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: a          # identifica a ORIGEM fora daqui (federation/remote write/alertas)

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: app
    static_configs:
      - targets: [app-a:8000]

remote_write:
  - url: http://receiver:9090/api/v1/write
    name: central
    queue_config:
      capacity: 2500
      max_shards: 10
      max_samples_per_send: 500
      batch_send_deadline: 5s
    write_relabel_configs:
      # objetivo: mandar SÓ os agregados (job:*) e o up; o resto fica local
      - source_labels: [__name__]
        regex: 'job:.*|up'
        action: drop
