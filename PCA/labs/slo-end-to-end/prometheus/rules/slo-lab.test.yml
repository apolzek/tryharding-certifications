# promtool test rules prometheus/rules/slo-lab.test.yml
# Mesma lógica dos testes de produção, com o relógio do lab (1:60): 30 req/s, amostras a cada 1s.
rule_files:
  - slo-lab.yml

evaluation_interval: 1s

tests:
  # ~4,8% de erro: o fast burn fica pending logo e firing depois do for de 30s
  - interval: 1s
    input_series:
      - series: 'http_requests_total{job="checkout",code="200"}'
        values: '0+30x120'
      - series: 'http_requests_total{job="checkout",code="500"}'
        values: '0+1.5x120'
    alert_rule_test:
      - { eval_time: 20s, alertname: SLOErrorBudgetBurnFast, exp_alerts: [] }
      - eval_time: 45s
        alertname: SLOErrorBudgetBurnFast
        exp_alerts:
          - exp_labels: { job: checkout, severity: page, slo: availability, burn_rate: "14.4", long_window: 1m }
            exp_annotations:
              summary: "checkout: queimando o error budget 14.4x mais rápido que o sustentável"
              description: 'Nesse ritmo, 2% do budget some em 1 "hora" (1min no lab) e tudo em ~2 "dias" (~50min no lab).'
  # saudável: nada dispara
  - interval: 1s
    input_series:
      - series: 'http_requests_total{job="checkout",code="200"}'
        values: '0+30x600'
      - series: 'http_requests_total{job="checkout",code="500"}'
        values: '0+0.015x600'
    alert_rule_test:
      - { eval_time: 10m, alertname: SLOErrorBudgetBurnFast, exp_alerts: [] }
      - { eval_time: 10m, alertname: SLOErrorBudgetBurnMedium, exp_alerts: [] }
