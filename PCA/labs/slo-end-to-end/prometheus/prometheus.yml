# Relógio do lab: 1s aqui ≈ 1min em produção (escala 1:60, veja rules/slo-lab.yml).
global:
  scrape_interval: 1s
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/rules/slo-lab.yml

scrape_configs:
  - job_name: checkout
    static_configs:
      - targets: ["app:8080"]
  - job_name: prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["localhost:9090"]
