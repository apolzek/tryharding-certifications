# Solução do exercício 05: SLO de latência (99% <= 300ms)
groups:
  - name: slo-checkout-latency
    rules:
      # 1) razão de buckets: "rápidas" = bucket le="0.3" (cumulativo!) / total
      - record: job:slo_latency_slow_per_request:ratio_rate5m
        expr: |
          1 - (
            sum by (job) (rate(http_request_duration_seconds_bucket{job="checkout",le="0.3"}[5m]))
            /
            sum by (job) (rate(http_request_duration_seconds_count{job="checkout"}[5m]))
          )
      - record: job:slo_latency_slow_per_request:ratio_rate1h
        expr: |
          1 - (
            sum by (job) (rate(http_request_duration_seconds_bucket{job="checkout",le="0.3"}[1h]))
            /
            sum by (job) (rate(http_request_duration_seconds_count{job="checkout"}[1h]))
          )
      # 2) histogram_fraction(lower, upper, h): fração das observações entre 0 e 0.3s.
      #    Funciona com native histograms e (no Prometheus 3.x) com classic, desde que o "le" fique no by.
      - record: job:slo_latency_good_per_request:fraction_rate5m
        expr: |
          histogram_fraction(0, 0.3,
            sum by (job, le) (rate(http_request_duration_seconds_bucket{job="checkout"}[5m])))
      - alert: SLOLatencyBudgetBurnFast
        expr: |
          job:slo_latency_slow_per_request:ratio_rate1h > (14.4 * 0.01)
          and
          job:slo_latency_slow_per_request:ratio_rate5m > (14.4 * 0.01)
        for: 2m
        labels: { severity: page, slo: latency }
        annotations:
          summary: "{{ $labels.job }}: mais de 14.4% das requisições acima de 300ms"
