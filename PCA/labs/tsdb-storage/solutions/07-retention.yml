# Solução do exercício 07: igual ao prometheus/prometheus.yml, mas com retenção de 6h.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

storage:
  tsdb:
    retention:
      time: 6h
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: generator
    static_configs:
      - targets: ["generator:8000"]
