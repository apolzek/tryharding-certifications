# GABARITO: prometheus.yml com os exercícios 03 (sondas blackbox), 04 (regras) e 06 (honor_labels).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: blackbox-exporter
    static_configs:
      - targets: ['blackbox:9115']

  # EX06: honor_labels: true -> os labels job/instance EMPURRADOS pelo batch job
  # vencem os labels do alvo (senão viram exported_job / exported_instance).
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  # EX03: o padrão de relabel do blackbox.
  # Os "targets" aqui NÃO são raspados: viram o parâmetro ?target= da URL /probe.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://prometheus:9090/-/healthy     # interno, OK
          - http://pushgateway:9091/-/healthy    # interno, OK
          - http://node-exporter:9999/           # porta fechada: vai FALHAR
    relabel_configs:
      - source_labels: [__address__]    # 1) o alvo original vira ?target=...
        target_label: __param_target
      - source_labels: [__param_target] # 2) ...e vira o label instance (legível)
        target_label: instance
      - target_label: __address__       # 3) quem é raspado de verdade é o blackbox
        replacement: blackbox:9115

  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [http_2xx_lab_ca]
    static_configs:
      - targets: ['https://https-site:8443/']
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: blackbox:9115 }

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['node-exporter:9100', 'pushgateway:9091']
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: blackbox:9115 }

  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ['node-exporter']
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: blackbox:9115 }

  - job_name: blackbox-dns
    metrics_path: /probe
    params:
      module: [dns_pushgateway]
    static_configs:
      - targets: ['127.0.0.11']   # o DNS embutido do Docker (visto de dentro do container do blackbox)
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: blackbox:9115 }
